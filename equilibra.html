<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e8a7b">
<meta name="color-scheme" content="light dark">
<script>let t0 = 'claro'; try { if (localStorage.getItem('equilibra:tema') === 'escuro') t0 = 'escuro'; } catch (e) {} document.documentElement.dataset.tema = t0;</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Equilibra</title>
<style>
:root{
  --verde:#0e8a7b; --verde-esc:#0a6a5e; --verde-claro:#e2f4f1; --topo:#0e8a7b;
  --tinta:#1b2a28; --suave:#5d716d; --linha:#e1e9e7; --fundo:#eef3f2; --papel:#fff;
  --deve:#c9481a; --deve-bg:#fdece4; --recebe:#1a7f45; --recebe-bg:#e5f5ec;
  --pend-bg:#fff6d6; --pend-tx:#8a6400; --pend-tx2:#6e5000; --erro-tx:#8f3210;
  --pag-bg:#f7faf9; --pag-ico:#e8efed; --barra2:#7cc6bc; --toast-bg:#1b2a28; --toast-tx:#fff; --link:#1a5fd0;
  color-scheme:light;
}
/* modo escuro: automático (segue o celular) ou escolhido em Conta › Aparência */
@media (prefers-color-scheme:dark){:root:not([data-tema="claro"]){
  --verde:#13a08f; --verde-esc:#6fd3c3; --verde-claro:#163834; --topo:#0b5f55;
  --tinta:#e4eeec; --suave:#9db1ad; --linha:#2b3b38; --fundo:#0d1514; --papel:#162120;
  --deve:#ff8f66; --deve-bg:#3b2119; --recebe:#63d397; --recebe-bg:#143022;
  --pend-bg:#3a3112; --pend-tx:#f2c94c; --pend-tx2:#f3d98b; --erro-tx:#ffb59a;
  --pag-bg:#1a2725; --pag-ico:#22312e; --barra2:#2f8c80; --toast-bg:#e4eeec; --toast-tx:#0d1514; --link:#8ab4ff;
  color-scheme:dark;
}}
:root[data-tema="escuro"]{
  --verde:#13a08f; --verde-esc:#6fd3c3; --verde-claro:#163834; --topo:#0b5f55;
  --tinta:#e4eeec; --suave:#9db1ad; --linha:#2b3b38; --fundo:#0d1514; --papel:#162120;
  --deve:#ff8f66; --deve-bg:#3b2119; --recebe:#63d397; --recebe-bg:#143022;
  --pend-bg:#3a3112; --pend-tx:#f2c94c; --pend-tx2:#f3d98b; --erro-tx:#ffb59a;
  --pag-bg:#1a2725; --pag-ico:#22312e; --barra2:#2f8c80; --toast-bg:#e4eeec; --toast-tx:#0d1514; --link:#8ab4ff;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;color:var(--tinta);background:var(--fundo)}
body.trava{overflow:hidden}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--papel);position:relative;padding-bottom:calc(132px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;text-align:inherit}
:focus-visible{outline:3px solid #f5b400;outline-offset:2px}

/* topo */
.topo{background:var(--topo);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 8px 12px 16px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:5;min-height:56px}
.topo h1{font-size:19px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topo.marca{padding-left:16px}
.topo .logo{display:inline-flex;color:#fff}
.ic{width:44px;height:44px;border-radius:50%;color:#fff;font-size:26px;line-height:1;display:grid;place-items:center;text-align:center}
.ic:active{background:rgba(255,255,255,.18)}

/* saldo */
.banner{margin:16px;padding:18px;border-radius:16px}
.banner.recebe{background:var(--recebe-bg);color:var(--recebe)}
.banner.deve{background:var(--deve-bg);color:var(--deve)}
.banner.quite{background:var(--verde-claro);color:var(--verde-esc)}
.banner .rotulo{font-size:14px;opacity:.85}
.banner .grande{font-size:22px;font-weight:700;margin:2px 0 0;line-height:1.25}
.banner .btn{margin-top:14px}
.sec{font-size:15px;font-weight:700;color:var(--suave);padding:8px 16px 4px}

/* botões */
.btn{background:var(--verde);color:#fff;border-radius:12px;padding:12px 18px;font-weight:700;min-height:46px;display:inline-flex;align-items:center;justify-content:center;text-align:center}
.btn:active{filter:brightness(.88)}
.btn-sec{border:2px solid var(--verde);color:var(--verde-esc);border-radius:12px;padding:10px 16px;font-weight:700;min-height:46px;display:inline-flex;align-items:center;justify-content:center;text-align:center;background:var(--papel)}
.btn.perigo{background:var(--deve)}
.btn-txt{color:var(--deve);font-weight:700;padding:12px;min-height:44px}
.cheio{display:flex;width:calc(100% - 32px);margin:14px 16px}
.acoes{display:flex;gap:10px;margin-top:18px}
.acoes>*{flex:1}
.fab{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom));right:max(16px,calc(50% - 224px));background:var(--verde);color:#fff;border-radius:999px;padding:14px 22px;font-weight:700;box-shadow:0 6px 18px rgba(10,106,94,.35);z-index:6;min-height:50px}
.fab.sozinho{bottom:calc(24px + env(safe-area-inset-bottom))}
.fab:active{filter:brightness(.88)}

/* listas */
.linha{display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;border-bottom:1px solid var(--linha);min-height:64px}
.linha:active{background:var(--fundo)}
.linha .ico{width:42px;height:42px;border-radius:12px;background:var(--verde-claro);display:grid;place-items:center;font-size:21px;flex:none}
.linha .mid{flex:1;min-width:0}
.linha .t{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.linha .s{display:block;font-size:14px;color:var(--suave)}
.linha .dir{text-align:right;flex:none}
.linha .dir small{display:block;font-size:12px}
.linha .dir b{font-size:16px}
.recebe{color:var(--recebe)} .deve{color:var(--deve)} .quite{color:var(--suave)}
.linha .dt{width:34px;text-align:center;flex:none;line-height:1.1}
.linha .dt b{display:block;font-size:17px}
.linha .dt span{font-size:12px;color:var(--suave)}
.linha.pag{background:var(--pag-bg)}
.linha.pag .ico{background:var(--pag-ico)}
.mes{padding:14px 16px 6px;font-size:14px;font-weight:700;color:var(--suave);text-transform:capitalize;background:var(--fundo)}
.vazio{padding:36px 24px;text-align:center;color:var(--suave)}
.vazio b{display:block;color:var(--tinta);font-size:17px;margin-bottom:4px}

/* grupo */
.faixa{display:flex;gap:8px;padding:0 16px 12px;overflow-x:auto}
.faixa button{flex:none;border:1.5px solid var(--linha);border-radius:999px;padding:9px 16px;font-weight:600;font-size:14px;min-height:42px;background:var(--papel)}
.busca{padding:0 16px 12px;position:relative}
.busca input{width:100%;border:1.5px solid var(--linha);border-radius:12px;padding:11px 14px 11px 42px;background:var(--papel)}
.busca input:focus{border-color:var(--verde);outline:none;box-shadow:0 0 0 3px var(--verde-claro)}
.busca .lupa{position:absolute;left:29px;bottom:24px;color:var(--suave);pointer-events:none}
.achados{padding:4px 16px 8px;font-size:13px;font-weight:600;color:var(--suave)}

/* detalhe */
.cartao{margin:16px;padding:18px;border:1.5px solid var(--linha);border-radius:16px}
.cartao .ico{width:52px;height:52px;border-radius:14px;background:var(--verde-claro);display:grid;place-items:center;font-size:26px;margin-bottom:10px}
.cartao h2{font-size:21px;line-height:1.25}
.cartao .valor{font-size:30px;font-weight:800;margin:2px 0 6px}
.cartao .meta{font-size:14px;color:var(--suave)}
.pessoa{display:flex;justify-content:space-between;gap:12px;padding:10px 16px;border-bottom:1px solid var(--linha)}
.pessoa span:last-child{text-align:right;color:var(--suave);font-size:14px}
.selo{display:inline-block;background:var(--verde-claro);color:var(--verde-esc);border-radius:8px;padding:3px 9px;font-size:13px;font-weight:600;margin-top:8px}
.coment{padding:10px 16px;border-bottom:1px solid var(--linha)}
.coment small{color:var(--suave)}
.escrever{display:flex;gap:8px;padding:12px 16px}
.escrever input{flex:1;min-width:0;border:1.5px solid var(--linha);border-radius:12px;padding:11px 14px;background:var(--papel)}

/* atividade */
.ativ{padding:12px 16px;border-bottom:1px solid var(--linha)}
.ativ p{line-height:1.35}
.ativ small{color:var(--suave);display:block;margin-top:2px}

/* formulários */
.sheet-wrap{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(18,38,34,.5)}
.sheet{position:relative;width:100%;max-width:480px;max-height:92vh;max-height:92dvh;overflow:auto;background:var(--papel);border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));animation:sobe .22s ease-out}
@keyframes sobe{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.sheet h2{font-size:20px;margin-bottom:14px}
.campo{display:block;margin-bottom:14px}
.campo>span,.campo>label{display:block;font-size:14px;font-weight:600;color:var(--suave);margin-bottom:5px}
.campo input,.campo select,.campo textarea{width:100%;border:1.5px solid var(--linha);border-radius:12px;padding:12px 14px;background:var(--papel);min-height:48px}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.moeda{display:flex;align-items:center;border:1.5px solid var(--linha);border-radius:12px;padding-left:14px;background:var(--papel)}
.campo>.moeda{display:flex;font-size:16px;font-weight:400;color:inherit;margin-bottom:0} /* gana de ".campo>span" */
.moeda b{color:var(--suave);font-weight:600}
.moeda input{border:0!important;min-width:0;flex:1;padding-left:8px!important}
/* o contorno amarelo envolve o campo inteiro (com o "R$"), não só a parte digitável */
.moeda:focus-within{outline:3px solid #f5b400;outline-offset:2px}
.moeda input:focus,.moeda input:focus-visible{outline:none}
.chk{display:flex;align-items:center;gap:10px;padding:10px 0;min-height:44px}
.chk input{width:22px;height:22px;accent-color:var(--verde)}
.dica{font-size:14px;color:var(--suave);margin:-4px 0 14px;min-height:20px}
.erro{background:var(--deve-bg);color:var(--erro-tx);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.opcao{display:flex;width:100%;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--linha);font-weight:600;min-height:52px}
.barra{margin:0 0 12px}
.barra div{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-bottom:4px}
.barra i{display:block;height:9px;border-radius:5px;background:var(--verde)}
.barra.b i{background:var(--barra2)}
.sub{font-size:15px;font-weight:700;margin:18px 0 10px}
.rot{display:block;font-size:14px;font-weight:600;color:var(--suave);margin:0 0 4px}
.dica .aviso{display:block;margin-top:8px;padding:9px 12px;border-radius:10px;background:var(--pend-bg);color:var(--pend-tx2);line-height:1.35}

/* navegação */
/* tipos de grupo e ícones */
.tipos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.tipo-chip{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:5px;border:1.5px solid var(--linha);border-radius:12px;padding:10px 4px;min-height:78px;font-size:12px;font-weight:600;text-align:center;line-height:1.15;background:var(--papel)}
.tipo-chip .ci{display:grid;place-items:center;height:30px;font-size:24px;line-height:1}
.tipo-chip.on{border-color:var(--verde);background:var(--verde-claro);color:var(--verde-esc)}
.tipo-chip.novo{border-style:dashed;color:var(--verde-esc);justify-content:center}
.grade-ic{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:14px}
.grade-ic button{display:grid;place-items:center;min-height:46px;border:1.5px solid var(--linha);border-radius:10px;font-size:22px;background:var(--papel)}
.grade-ic button.on{border-color:var(--verde);background:var(--verde-claro)}
.previa{display:flex;align-items:center;gap:12px;min-height:54px;padding:10px 14px;border:1.5px solid var(--linha);border-radius:12px;margin-bottom:6px;color:var(--suave);font-size:14px}
.previa b{color:var(--tinta);font-size:16px}
.previa .pi{display:grid;place-items:center;min-width:34px;font-size:28px}
.tipo-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--linha)}
.tipo-item span{display:flex;align-items:center;gap:10px;font-size:16px;min-width:0}
.linha .ico svg{display:block}

.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--papel);border-top:1px solid var(--linha);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom);z-index:7}
.nav button{padding:8px 4px 9px;text-align:center;font-size:12px;font-weight:600;color:var(--suave);min-height:60px}
.nav button span{display:block;font-size:22px;line-height:1.2}
.nav button.on{color:var(--verde-esc)}
.nav button{position:relative}
.ponto-nav{position:absolute;top:7px;left:calc(50% + 8px);width:10px;height:10px;border-radius:50%;background:var(--deve);border:2px solid var(--papel)}

/* amigos */
.com-amigo{color:#fff;background:rgba(255,255,255,.16);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;max-width:46%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:34px}
.com-amigo:active{background:rgba(255,255,255,.28)}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:18px;flex:none}
img.avatar{object-fit:cover;background:var(--linha)}

/* nota fiscal */
.link{color:var(--link);text-decoration:underline;text-underline-offset:3px;font-weight:600}
.nf{margin:0 16px 14px;padding:14px 16px;border:1.5px solid var(--linha);border-radius:14px}
.nf.nf-box{margin:0 0 14px}
.nf-tit{font-size:14px;font-weight:700;color:var(--suave);margin-bottom:6px}
.nf-emp{font-size:17px;font-weight:700;line-height:1.3}
.nf .meta{font-size:14px;color:var(--suave)}
.nf-link{margin-top:8px;display:flex;flex-wrap:wrap;align-items:baseline;gap:8px}
.nf-aviso{margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--pend-bg);color:var(--pend-tx2);font-size:14px;line-height:1.35}
.nf-scan{width:100%;margin-bottom:14px;gap:8px}

/* câmera de QR (por cima de tudo) */
.camada{position:fixed;inset:0;z-index:40;background:#000;color:#fff;display:flex;flex-direction:column}
.camada-topo{display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 8px 10px 16px;font-size:18px}
.camada-video{position:relative;flex:1;min-height:0;overflow:hidden}
.camada-video video{width:100%;height:100%;object-fit:cover}
.camada .mira{position:absolute;left:50%;top:50%;width:min(64vw,280px);aspect-ratio:1;transform:translate(-50%,-50%);border:3px solid rgba(255,255,255,.9);border-radius:18px;box-shadow:0 0 0 2000px rgba(0,0,0,.35)}
.camada-pe{padding:14px 16px calc(16px + env(safe-area-inset-bottom));background:#111}
.camada-pe p{font-size:15px;margin-bottom:10px}
.cam-erro{color:#ffc39f}
.colar{display:flex;gap:8px}
.colar input{flex:1;min-width:0;border:1.5px solid #444;border-radius:12px;padding:11px 12px;background:#1d1d1d;color:#fff}
.avatar.mini{width:22px;height:22px;font-size:11px;display:inline-grid;vertical-align:middle}
.avatar.g{width:76px;height:76px;font-size:32px}
.com-amigo{display:inline-flex;align-items:center;gap:7px}
.com-amigo span{overflow:hidden;text-overflow:ellipsis}
.pessoa .quem{display:inline-flex;align-items:center;gap:8px}
.perfil{display:flex;align-items:center;gap:18px;padding:18px 0 6px}
.perfil-foto{position:relative;border-radius:50%;flex:none}
.perfil-foto .cam{position:absolute;right:-4px;bottom:-2px;width:30px;height:30px;border-radius:9px;background:var(--papel);color:var(--tinta);display:grid;place-items:center;box-shadow:0 1px 5px rgba(0,0,0,.3)}
.perfil-txt{min-width:0}
.perfil-txt b{display:block;font-size:21px;line-height:1.2;overflow:hidden;text-overflow:ellipsis}
.perfil-txt small{display:block;color:var(--suave);font-size:14px;margin-top:3px}
.selo-atual{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;background:var(--verde-claro);color:var(--verde-esc);font-size:12px;font-weight:700;vertical-align:2px}
.topo.marca h1{flex:1}

/* boas-vindas */
.boas{padding:calc(56px + env(safe-area-inset-top)) 24px 32px}
.boas .logo{color:var(--verde);display:inline-flex;margin-bottom:12px}
.boas h1{font-size:34px;letter-spacing:-.5px}
.boas p{color:var(--suave);margin:8px 0 28px;font-size:17px}

/* conta */
.caixa{margin:16px;padding:14px 16px;border-radius:14px;background:var(--verde-claro);color:var(--verde-esc);font-size:15px}
.bloco{padding:6px 16px 10px}
.bloco h2{font-size:15px;color:var(--suave);margin:14px 0 8px}

.ic{position:relative}
.ic.pend::after{content:"";position:absolute;top:8px;right:8px;width:11px;height:11px;border-radius:50%;background:#ffb020;border:2px solid var(--topo)}
.explica{font-size:14px;color:var(--suave);margin:4px 0 10px}
.estado{font-weight:700;margin:6px 0 2px}
.estado.ok{color:var(--recebe)} .estado.falta{color:var(--deve)}
.ou{text-align:center;color:var(--suave);margin:18px 0 12px;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(130px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--toast-bg);color:var(--toast-tx);padding:11px 18px;border-radius:12px;z-index:30;font-size:15px;max-width:90%;text-align:center}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
@media (min-width:520px){body{padding:0}#app{box-shadow:0 0 0 1px var(--linha)}}
.ativ[data-a]{cursor:pointer}
/* cores: amarelo = esperando confirmação; verde = a favor de quem usa o aparelho; vermelho = contra */
.ativ.pend,.linha.pend,.linha.pag.pend{background:var(--pend-bg)}
.ativ.ativo{background:var(--recebe-bg)}
.ativ.passivo{background:var(--deve-bg)}
.ativ{position:relative}
.ativ.pend{padding-right:44px}
.ativ .ampulheta{position:absolute;right:14px;bottom:10px;font-size:18px;line-height:1}
.faixa button{position:relative}
.faixa button.on{border-color:var(--verde);background:var(--verde-claro);color:var(--verde-esc)}
.faixa button.ponto::after{content:"";position:absolute;top:3px;right:3px;width:10px;height:10px;border-radius:50%;background:var(--deve);border:2px solid var(--papel)}
.qr{display:flex;justify-content:center;margin:14px 0 6px}
.qr svg{width:min(270px,72vw);height:auto;border-radius:8px;transition:opacity .3s}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.st{font-weight:700}
.st.pend{color:var(--pend-tx)}.st.ok{color:var(--verde-esc)}.st.rec{color:var(--suave)}
.dir.espera{color:var(--pend-tx)}
.banner .pendente{margin-top:12px;padding:9px 12px;border-radius:10px;background:var(--pend-bg);color:var(--pend-tx2);font-size:14px;line-height:1.35}
.stbox{margin:12px 16px;padding:12px 14px;border-radius:12px;background:var(--fundo)}
.stbox.pend{background:var(--pend-bg);color:var(--pend-tx2)}.stbox.ok{background:var(--fundo);color:var(--verde-esc)}.stbox.rec{background:var(--fundo);color:var(--suave)}
.hist{padding:10px 16px;border-bottom:1px solid var(--linha)}
.hist small{display:block;color:var(--suave)}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet" class="sheet-wrap" hidden>
  <div class="sheet-bg" data-a="fecharSheet"></div>

<script>
(() => {
'use strict';

/* ============================================================
   ARMAZENAMENTO
   Cada amigo é um "par" (você + ele), com os próprios eventos,
   grupos e sincronização. O primeiro par continua na chave antiga
   (equilibra:v1); os outros ficam em equilibra:par:<id>. A lista
   de amigos e qual está aberto ficam em equilibra:amigos.
   ============================================================ */
const KEY = 'equilibra:v1', KEY_AMIGOS = 'equilibra:amigos', PRINCIPAL = 'principal';
const chavePar = id => (!id || id === PRINCIPAL ? KEY : 'equilibra:par:' + id);
const mem = {};
const store = {
  load(id) { const k = chavePar(id); try { const s = localStorage.getItem(k); if (s) return JSON.parse(s); } catch (e) {} return mem[k] || null; },
  save(d) { if (!d) return; const k = chavePar(d.parId); mem[k] = d; try { localStorage.setItem(k, JSON.stringify(d)); } catch (e) {} },
  remove(id) { const k = chavePar(id); delete mem[k]; try { localStorage.removeItem(k); } catch (e) {} }
};
function lerAmigos() {
  let a = null;
  try { a = JSON.parse(localStorage.getItem(KEY_AMIGOS) || 'null'); } catch (e) {}
  if (!a || !Array.isArray(a.ids)) a = mem[KEY_AMIGOS] || { atual: PRINCIPAL, ids: [PRINCIPAL] };
  a.ids = a.ids.filter(id => store.load(id));
  if (!a.ids.includes(a.atual)) a.atual = a.ids[0] || PRINCIPAL;
  return a;
}
function salvarAmigos() { mem[KEY_AMIGOS] = amigos; try { localStorage.setItem(KEY_AMIGOS, JSON.stringify(amigos)); } catch (e) {} }
let amigos = lerAmigos();
const idDe = dd => (dd && dd.parId) || PRINCIPAL;
function carregarPar(id) {
  const d = store.load(id); if (d && id && id !== PRINCIPAL) d.parId = id;
  /* descarta lixo guardado por versões antigas; data no futuro fica (pode ser só o relógio adiantado) */
  if (d && Array.isArray(d.eventos)) d.eventos = d.eventos.filter(e => eventoValido(e, Infinity));
  return migrarSync(d);
}
function registrarPar(dd) { const id = idDe(dd); if (!amigos.ids.includes(id)) amigos.ids.push(id); salvarAmigos(); }
/* passa a mostrar outro amigo: salva o atual e zera o que está aberto na tela */
function abrirPar(dd) {
  if (data && data !== dd && idDe(data) !== idDe(dd)) store.save(data);
  data = dd; amigos.atual = idDe(dd); salvarAmigos();
  Object.assign(ui, { view: null, tab: 'grupos', busca: '', buscaAtiv: '', soPend: false, pedido: null });
  ui.pedidos[amigos.atual] = null;
  setSync('', '');
}
/* um amigo novo reaproveita a chave da digital deste aparelho (não precisa cadastrar a digital de novo) */
function copiarChaveDigital(dd) {
  if (!data || !data.cidLocal) return;
  const k = data.eventos.find(e => e.tipo === 'chave' && e.autor === data.config.eu && e.dados && e.dados.cid === data.cidLocal);
  if (!k) return;
  dd.cidLocal = data.cidLocal;
  dd.eventos.push({ id: uid(), tipo: 'chave', autor: dd.config.eu, ts: Date.now(), dados: { cid: k.dados.cid, pub: k.dados.pub } });
}
/* um amigo novo já começa com a sua foto de perfil */
function copiarMinhaFoto(dd) {
  const f = data && fotoDe(data, data.config.eu); if (!f) return;
  const eu = dd.config.eu;
  dd.config.fotos = { ...(dd.config.fotos || {}), [eu]: f };
  dd.config.fotosTs = { ...(dd.config.fotosTs || {}), [eu]: (data.config.fotosTs || {})[data.config.eu] || Date.now() };
}
let data = carregarPar(amigos.atual);
const ui = { tab: 'grupos', view: null, busca: '', sync: { estado: '', msg: '' }, pedidos: {} };
let sheetEstado = null;
let confirmCb = null;
let pararSheet = null; /* desliga câmera ou temporizador da folha aberta */
let camAtual = null; /* câmera de QR aberta por cima da tela */

/* ============================================================
   UTILITÁRIOS
   ============================================================ */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const brl = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
const R = c => brl.format(c / 100);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const hoje = () => ymd(new Date());
const dataLonga = iso => new Date(iso + 'T12:00:00').toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });
const diaMes = iso => { const d = new Date(iso + 'T12:00:00'); return { d: String(d.getDate()).padStart(2, '0'), m: d.toLocaleDateString('pt-BR', { month: 'short' }).replace('.', '') }; };
const rotuloMes = k => new Date(k + '-15T12:00:00').toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
const quando = ts => new Date(ts).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
const fmtIn = c => (c / 100).toFixed(2).replace('.', ',');
const rolar = () => window.scrollTo(0, 0);

function parseValor(s) {
  s = String(s || '').trim().replace(/[R$\s]/g, '');
  if (!s) return NaN;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  const n = Number(s);
  return isFinite(n) ? Math.round(n * 100) : NaN;
}
function addMeses(iso, n) {
  const [y, m, d] = iso.split('-').map(Number);
  const t = new Date(y, m - 1 + n, 1);
  const ult = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate();
  t.setDate(Math.min(d, ult));
  return ymd(t);
}
function addDias(iso, n) { const t = new Date(iso + 'T12:00:00'); t.setDate(t.getDate() + n); return ymd(t); }

let toastT;
function toast(msg) {

}

const LOGO = '<svg viewBox="0 0 48 48" width="30" height="30" aria-hidden="true"><circle cx="10" cy="15" r="6" fill="currentColor"/><circle cx="38" cy="15" r="6" fill="currentColor"/><rect x="4" y="21" width="40" height="4" rx="2" fill="currentColor"/><path d="M24 25 L16 42 H32 Z" fill="currentColor"/></svg>';

const CATS = [

const cat = id => CATS.find(c => c.id === id) || CATS[CATS.length - 1];
const CARTOES = [
  { id: 'laranja', r: 'Laranja', c: '#ff7a00' },
  { id: 'vermelho', r: 'Vermelho', c: '#d62839' },
  { id: 'roxo', r: 'Roxo', c: '#7b2fbe' },
  { id: 'azul', r: 'Azul', c: '#1f6feb' },
  { id: 'verde', r: 'Verde', c: '#1e9e5a' },
  { id: 'rosa', r: 'Rosa', c: '#e0479e' },
  { id: 'amarelo', r: 'Amarelo', c: '#f2b01e' },

  { id: 'marrom', r: 'Marrom', c: '#8d5524' },
  { id: 'vinho', r: 'Vinho', c: '#8e1b3a' }
];
const EMOJIS = ['🏠', '🏢', '🔑', '💡', '⚡', '💧', '🚿', '🔥', '🌐', '📶', '📱', '📺',
  '🎬', '🎵', '🛒', '🍽️', '☕', '🚗', '⛽', '🚌', '✈️', '🏖️', '💊', '🏥',
  '🐾', '🎁', '👶', '🎓', '🏋️', '💈', '🧾', '💰', '🏦', '💳', '🧺', '🛠️',
  '🌱', '🎉', '❤️', '📌', '⭐', '🛍️', '🧹', '🍕', '🎮', '📚', '🚲', '🏷️'];
const TIPOS_BASE = [
  { id: 'b-casa', nome: 'Casa', icone: '🏠' },
  { id: 'b-viagem', nome: 'Viagem', icone: '✈️' },
  { id: 'b-casal', nome: 'Casal', icone: '❤️' },
  { id: 'b-compras', nome: 'Compras', icone: '🛒' },

  { id: 'b-energia', nome: 'Conta de energia', icone: '⚡' },

  { id: 'b-gas', nome: 'Gás', icone: '🔥' },

  { id: 'b-streaming', nome: 'Streaming', icone: '📺' },
  { id: 'b-outro', nome: 'Outro', icone: '📌' }
];
const tiposAtivos = D => [...TIPOS_BASE, ...[...D.tipos.values()].filter(t => !t.apagado)];
function iconeCartao(cor, px) {
  const c = (CARTOES.find(x => x.id === cor) || CARTOES[0]).c, w = px || 28;
  return `<svg viewBox="0 0 32 24" width="${w}" height="${Math.round(w * 0.75)}" aria-hidden="true"><rect x="1" y="2" width="30" height="20" rx="3.5" fill="${c}"/><rect x="1" y="7" width="30" height="4" fill="rgba(0,0,0,.3)"/><rect x="5" y="15" width="8" height="4" rx="1.2" fill="rgba(255,255,255,.88)"/></svg>`;
}
const iconeHTML = (v, px) => (String(v || '').startsWith('card:') ? iconeCartao(String(v).slice(5), px) : esc(v));
const iconeTxt = v => (String(v || '').startsWith('card:') ? '💳' : (v || ''));
const FORMAS = ['Pix', 'Dinheiro', 'Transferência', 'Outro'];

const EU = () => data.config.eu;
const OUT = () => (EU() === 'a' ? 'b' : 'a');
const nome = p => data.config.nomes[p];
const quem = p => (p === EU() ? 'Você' : nome(p));

/* ============================================================
   EVENTOS  ->  ESTADO
   Nada é sobrescrito: editar/apagar = novo evento.
   ============================================================ */
function addEvento(e) {
  e.id = e.id || uid();
  e.ts = e.ts || Date.now();
  e.autor = e.autor || EU();
  data.eventos.push(e);
  store.save(data);
}
/* confere a forma de um evento (vindo de outro celular, do servidor ou de backup) antes de usar;
   um evento estranho é ignorado em vez de travar a app. Tipos desconhecidos passam (versões futuras). */
function eventoValido(e, agora = Date.now()) {
  const obj = x => !!x && typeof x === 'object' && !Array.isArray(x);
  const txt = (x, n) => typeof x === 'string' && x.length <= n;
  const opt = (x, f) => x === undefined || x === null || f(x);
  const cent = x => Number.isSafeInteger(x) && x >= 0 && x <= 1e11;
  const par = x => obj(x) && cent(x.a) && cent(x.b);
  const pessoa = x => x === 'a' || x === 'b';
  const dia = x => typeof x === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(x);
  if (!obj(e) || !txt(e.id, 120) || !/^[\w@.:-]+$/.test(e.id) || !txt(e.tipo, 30) || !pessoa(e.autor)) return false;
  if (!Number.isFinite(e.ts) || e.ts < 0 || e.ts > agora + 2 * 864e5) return false; /* data no futuro ficaria sempre por último */
  if (!opt(e.alvo, x => txt(x, 120)) || !opt(e.dados, obj)) return false;
  if (!opt(e.assin, a => obj(a) && ['cid', 'ad', 'cd', 'sig'].every(k => txt(a[k], 4000)))) return false;
  let tam = 0; try { tam = JSON.stringify(e).length; } catch (er) { return false; }
  if (tam > 20000) return false;
  const d = e.dados || {}, alvo = typeof e.alvo === 'string';
  switch (e.tipo) {
    case 'grupo': case 'tgrupo': return txt(d.nome, 60) && txt(d.icone, 40);
    case 'grupo_edit': return alvo && opt(d.nome, x => txt(x, 60)) && opt(d.icone, x => txt(x, 40));
    case 'grupo_del': case 'tgrupo_del': case 'despesa_del': case 'pagamento_del': return alvo;
    case 'despesa': case 'despesa_edit': {
      const novo = e.tipo === 'despesa';
      if (!novo && !alvo) return false;
      if (novo && !(cent(d.valor) && d.valor > 0 && par(d.pagou) && par(d.devido) && txt(d.desc, 300))) return false;
      return opt(d.valor, x => cent(x) && x > 0) && opt(d.pagou, par) && opt(d.devido, par) && opt(d.desc, x => txt(x, 300)) &&
        opt(d.data, dia) && opt(d.nota, x => txt(x, 2000)) && opt(d.grupo, x => txt(x, 120)) && opt(d.cat, x => txt(x, 60)) &&
        opt(d.pagouModo, x => txt(x, 10)) && opt(d.tipo, x => txt(x, 10)) && opt(d.ent, obj) && opt(d.nf, obj) &&
        opt(d.rec, x => x === 'mensal' || x === 'semanal') && opt(d.origem, x => txt(x, 120));
    }
    case 'pagamento': return pessoa(d.de) && pessoa(d.para) && d.de !== d.para && cent(d.valor) && d.valor > 0 && opt(d.data, dia) && opt(d.forma, x => txt(x, 30)) && opt(d.grupo, x => txt(x, 120));
    case 'confirma': return txt(d.rev, 120) && obj(d.ass);
    case 'recusa': return txt(d.rev, 120);
    case 'comentario': return alvo && txt(d.texto, 2000);
    case 'chave': return txt(d.cid, 1000) && txt(d.pub, 1000);
  }
  return true;
}
/* conta qualquer despesa ou pagamento não apagado, confirmado ou não */
const grupoTemConteudo = (desp, pag, gid) => [...desp.values(), ...pag.values()].some(x => !x.apagada && !x.apagado && (x.grupo === gid || (x.proj && x.proj.grupo === gid)));
function derivar(dd = data) {
  const evs = dd.eventos.filter(e => eventoValido(e)).sort((x, y) => x.ts - y.ts || String(x.id).localeCompare(String(y.id)));
  const grupos = new Map([['casal', { id: 'casal', nome: 'Nós dois', icone: '🤝', padrao: true, ts: 0 }]]);
  const desp = new Map(), pag = new Map(), coms = [], tipos = new Map();
  const itens = new Map(), rev = new Map(), confs = new Map(), recs = new Map(), gdels = new Map(), verif = dd.verif || {};
  const nova = (e, tipo, item, k) => { const r = { id: e.id, item, k, tipo, autor: e.autor, ts: e.ts, dados: e.dados || {}, assin: e.assin }; rev.set(e.id, r); return r; };
  const juntar = (m, k, e) => { if (!m.has(k)) m.set(k, []); m.get(k).push(e); };
  for (const e of evs) {
    switch (e.tipo) {
      case 'grupo': if (!grupos.has(e.id)) grupos.set(e.id, { id: e.id, nome: e.dados.nome, icone: e.dados.icone, ts: e.ts, autor: e.autor }); break;
      case 'grupo_edit': { const g = grupos.get(e.alvo); if (g) { if (e.dados.nome) g.nome = e.dados.nome; if (e.dados.icone) g.icone = e.dados.icone; } break; }
      case 'grupo_del': { const g = grupos.get(e.alvo); if (g && !g.padrao) juntar(gdels, e.alvo, nova(e, 'excluir', e.alvo, 'g')); break; }
      case 'tgrupo': tipos.set(e.id, { id: e.id, nome: e.dados.nome, icone: e.dados.icone, ts: e.ts, autor: e.autor }); break;
      case 'tgrupo_del': if (tipos.has(e.alvo)) tipos.get(e.alvo).apagado = true; break;
      case 'despesa': itens.set(e.id, { k: 'd', id: e.id, revs: [nova(e, 'criar', e.id, 'd')] }); break;
      case 'despesa_edit': { const it = itens.get(e.alvo); if (it && it.k === 'd') it.revs.push(nova(e, 'editar', e.alvo, 'd')); break; }
      case 'despesa_del': { const it = itens.get(e.alvo); if (it && it.k === 'd') it.revs.push(nova(e, 'excluir', e.alvo, 'd')); break; }
      case 'pagamento': itens.set(e.id, { k: 'p', id: e.id, revs: [nova(e, 'criar', e.id, 'p')] }); break;
      case 'pagamento_del': { const it = itens.get(e.alvo); if (it && it.k === 'p') it.revs.push(nova(e, 'excluir', e.alvo, 'p')); break; }
      case 'confirma': if (verif[e.id] === true && e.dados) juntar(confs, e.dados.rev, e); break;
      case 'recusa': if (e.dados) juntar(recs, e.dados.rev, e); break;
      case 'comentario': coms.push({ id: e.id, alvo: e.alvo, texto: e.dados.texto, autor: e.autor, ts: e.ts }); break;
    }
  }
  /* uma versão vale quando a OUTRA pessoa confirma (com a digital verificada) ou quando há confirmação automática */
  const marcar = (r, auto) => {
    const o = r.autor === 'a' ? 'b' : 'a';
    const cf = (confs.get(r.id) || []).find(x => x.autor === o) || (auto ? { auto: true, autor: o, ts: r.ts, ...auto } : null);
    const rc = (recs.get(r.id) || []).find(x => x.autor === o);
    r.cf = cf; r.rc = rc; r.st = cf ? 'confirmado' : rc ? 'recusado' : 'pendente';
  };
  for (const it of itens.values()) {
    for (const r of it.revs) marcar(r, r.tipo === 'criar' && r.dados.origem ? {} : null);
    for (const r of it.revs) {
      if (r.tipo === 'excluir' && r.st === 'pendente' && r.dados.retirar && r.autor === it.revs[0].autor && it.revs.every(q => q === r || q.st !== 'confirmado')) {
        r.st = 'confirmado'; r.cf = { auto: true, retirada: true, autor: r.autor, ts: r.ts };
      }
    }
    /* ef = como fica se tudo o que está pendente for aceito; vale = o que já foi confirmado (é o que entra no saldo) */
    let ef = null, ed = false, vale = null, edVale = false; const ativas = [];
    for (const r of it.revs) {
      r.antes = ef;
      if (r.st === 'recusado') continue;
      ativas.push(r);
      if (r.tipo === 'criar') ef = { ...r.dados };
      else if (r.tipo === 'editar' && ef) { ef = { ...ef, ...r.dados }; ed = true; }
      /* confirmar uma versão aprova também as versões anteriores que ela substituiu */
      if (r.st === 'confirmado' && r.tipo !== 'excluir' && ef) { vale = ef; edVale = ed; }
    }
    if (!ef) continue;
    const L = ativas[ativas.length - 1];
    ativas.forEach(r => { r.sup = r !== L && r.st === 'pendente'; });
    const apagada = L.tipo === 'excluir' && L.st === 'confirmado';
    const exclusaoPendente = L.tipo === 'excluir' && L.st === 'pendente';
    const base = { id: it.id, ...(vale || ef), editado: vale ? edVale : ed, autor: it.revs[0].autor, ts: it.revs[0].ts, st: L.st, ultima: L, revs: it.revs, exclusaoPendente,
      valido: !!vale, conta: vale, proj: exclusaoPendente ? null : ef, atual: ef, proposta: vale && ef !== vale ? ef : null };
    if (it.k === 'd') desp.set(it.id, { ...base, apagada }); else pag.set(it.id, { ...base, apagado: apagada });
  }
  /* apagar grupo: se tem despesas ou pagamentos, só vale quando a outra pessoa confirma com a digital;
     vazio, some na hora. "Vazio" é calculado aqui, nunca vem do evento. */
  for (const [gid, dels] of gdels) {
    const g = grupos.get(gid);
    const vazio = !grupoTemConteudo(desp, pag, gid);
    dels.forEach(r => marcar(r, vazio ? { vazio: true } : null));
    const ativas = dels.filter(r => r.st !== 'recusado'), L = ativas[ativas.length - 1];
    ativas.forEach(r => { r.sup = r !== L && r.st === 'pendente'; });
    if (!L) continue;
    if (L.st === 'confirmado') g.apagado = true; else g.exclusao = L;
  }
  return { evs, grupos, desp, pag, coms, tipos, rev };
}
/* ============================================================
   CONFIRMAÇÃO POR DIGITAL (WebAuthn)
   Cada aparelho cria uma chave guardada no chip de segurança.
   Cada versão de uma despesa/pagamento é assinada por quem a fez

function tituloEmpresa(s) {
  const pequenas = new Set(['de', 'da', 'do', 'das', 'dos', 'e']);
  return String(s || '').toLowerCase().replace(/\s+/g, ' ').trim().split(' ')
    .map((w, i) => (i && pequenas.has(w) ? w
      : /^(s\/?a|me|epp|eireli)$/.test(w) || /^[a-z]{2,4}$/.test(w) && !/[aeiouy]/.test(w) ? w.toUpperCase() /* siglas: SDB, LTDA fica Ltda */
        : w.replace(/(^|-)(\S)/g, (m, a, b) => a + b.toUpperCase()))).join(' ');
}
/* nome da loja pelo CNPJ (consulta pública; só o CNPJ sai do aparelho). Guarda o resultado para não repetir. */
async function buscarEmpresa(cnpj) {
  const k = 'equilibra:cnpj:' + cnpj;
  try { const c = JSON.parse(localStorage.getItem(k) || 'null'); if (c && c.nome) return c; } catch (e) {}
  if (!/^[0-9]{14}$/.test(cnpj)) return null;
  for (const url of [`https://brasilapi.com.br/api/cnpj/v1/${cnpj}`, `https://publica.cnpj.ws/cnpj/${cnpj}`]) {
    try {
      const ctl = typeof AbortController === 'function' ? new AbortController() : null;
      const t = ctl ? setTimeout(() => ctl.abort(), 8000) : 0;
      const r = await fetch(url, ctl ? { signal: ctl.signal } : {});
      clearTimeout(t);
      if (!r.ok) continue;
      const j = await r.json(), est = j.estabelecimento || {};
      const razao = String(j.razao_social || '').trim(), fantasia = String(j.nome_fantasia || est.nome_fantasia || '').trim();
      if (!razao && !fantasia) continue;
      const cnae = String(j.cnae_fiscal || (est.atividade_principal && est.atividade_principal.id) || '').replace(/\D/g, '').slice(0, 7);
      const res = { nome: tituloEmpresa(fantasia || razao).slice(0, 60), razao: tituloEmpresa(razao).slice(0, 120), cnae };
      try { localStorage.setItem(k, JSON.stringify(res)); } catch (e) {}
      return res;
    } catch (e) {}
  }
  return null;
}
/* categoria sugerida pela atividade principal da loja (CNAE) */
function catPorCnae(c) {
  const n = String(c || '');
  if (/^47(11|12|21|22|23|24|29)/.test(n)) return 'mercado';
  if (/^56/.test(n)) return 'restaurante';
  if (n === '4789004' || /^75/.test(n)) return 'pet';
  if (/^(4771|86|87)/.test(n)) return 'saude';
  if (/^(4731|4732|4520|4530|49|52)/.test(n)) return 'transporte';
  if (/^(55|51|7911)/.test(n)) return 'viagem';
  if (/^(59|90|91|93)/.test(n)) return 'lazer';
  if (/^(35|36|61)/.test(n)) return 'contas';
  if (/^(68|474[1-4])/.test(n)) return 'moradia';
  if (/^47/.test(n)) return 'compras';
  return null;
}

/* --- câmera para ler QR (nota fiscal ou convite), por cima de qualquer tela --- */
function lerQRCamera({ titulo, dica, aceitar }) {
  return new Promise(resolve => {
    const w = document.createElement('div');
    w.className = 'camada'; w.setAttribute('role', 'dialog'); w.setAttribute('aria-modal', 'true');
    const temLeitor = 'BarcodeDetector' in window && navigator.mediaDevices && navigator.mediaDevices.getUserMedia;
    w.innerHTML = `<div class="camada-topo"><b>${esc(titulo)}</b><button class="ic" data-cam="fechar" aria-label="Fechar">✕</button></div>
      ${temLeitor ? '<div class="camada-video"><video playsinline muted autoplay></video><i class="mira" aria-hidden="true"></i></div>' : ''}
      <div class="camada-pe"><p class="cam-dica">${esc(temLeitor ? dica : 'Este navegador não lê QR pela câmera. Cole aqui o link do QR.')}</p>
      <p class="cam-erro" role="alert" hidden></p>
      <div class="colar"><input type="url" placeholder="${temLeitor ? 'ou cole o link do QR' : 'https://…'}" aria-label="Link do QR" autocomplete="off"><button class="btn" data-cam="usar">Usar</button></div></div>`;
    document.body.appendChild(w);
    let stream = null, aberta = true;
    const fim = r => {
      if (!aberta) return; aberta = false;
      if (stream) stream.getTracks().forEach(t => t.stop());
      w.remove(); camAtual = null; ajustarHistorico(); resolve(r);
    };
    const erro = m => { const e = w.querySelector('.cam-erro'); e.textContent = m; e.hidden = false; };
    camAtual = { fechar: () => fim(null) };
    ajustarHistorico();
    w.addEventListener('click', ev => {
      const b = ev.target.closest && ev.target.closest('[data-cam]'); if (!b) return;
      if (b.dataset.cam === 'fechar') return fim(null);
      const r = aceitar(w.querySelector('input').value.trim());
      if (r) fim(r); else erro('Este link não é o esperado. Confira e tente de novo.');
    });
    if (!temLeitor) return;
    (async () => {
      try {
        const det = new BarcodeDetector({ formats: ['qr_code'] });
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
        if (!aberta) { stream.getTracks().forEach(t => t.stop()); return; }
        const v = w.querySelector('video'); v.srcObject = stream; if (v.play) v.play().catch(() => {});
        let visto = '';
        const procurar = async () => {
          if (!aberta) return;
          try {
            for (const c of await det.detect(v)) {
              const r = aceitar(c.rawValue); if (r) return fim(r);
              if (c.rawValue !== visto) { visto = c.rawValue; erro('Este QR não é o esperado. Aponte para o QR certo.'); }
            }
          } catch (e) {}
          setTimeout(procurar, 250);
        };
        procurar();
      } catch (e) { erro('Não foi possível abrir a câmera. Permita o acesso à câmera ou cole o link abaixo.'); }
    })();
  });
}

function listaGrupo(D, gid, q) {
  const termos = norm(q).split(/\s+/).filter(Boolean);
  let itens = [
    ...[...D.desp.values()].filter(d => !d.apagada && d.grupo === gid).map(d => ({ k: 'd', x: d })),
    ...[...D.pag.values()].filter(p => !p.apagado && p.grupo === gid).map(p => ({ k: 'p', x: p }))
  ];
  if (termos.length) {
    itens = itens.filter(({ k, x }) => {
      const txt = norm(k === 'd'
        ? `${x.desc} ${cat(x.cat).r} ${fmtIn(x.valor)} ${R(x.valor)} ${x.nota || ''} ${quem(x.autor)} ${nfBusca(x.nf)}`
        : `${textoPag(x)} ${x.forma || ''} ${fmtIn(x.valor)} ${R(x.valor)}`);
      return termos.every(w => txt.includes(w));
    });
  }
  if (!itens.length) {
    return q ? '<div class="vazio"><b>Nada encontrado</b>Tente outro termo de busca.</div>'
      : '<div class="vazio"><b>Nenhuma despesa ainda</b>Toque em “Adicionar despesa” para registrar a primeira.</div>';
  }
  itens.sort((m, n) => n.x.data.localeCompare(m.x.data) || n.x.ts - m.x.ts);
  let out = '', mesAtual = '';
  for (const { k, x } of itens) {
    const mk = x.data.slice(0, 7);
    if (mk !== mesAtual) { mesAtual = mk; out += `<div class="mes">${esc(rotuloMes(mk))}</div>`; }
    out += k === 'd' ? linhaDespesa(x) : linhaPag(x);
  }
  return out;
}

const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ /g, ' ').toLowerCase();
function textoBusca(e, D, x) {
  const partes = [x.t, x.s, quando(e.ts)];
  const alvo = e.tipo === 'despesa' || e.tipo === 'pagamento' ? e.id : e.alvo;
  const it = D.desp.get(alvo) || D.pag.get(alvo);
  for (const d of [e.dados, it && it.atual, it && it.conta]) {
    if (!d) continue;
    partes.push(d.desc, d.nota, d.forma, d.texto, d.nome, nfBusca(d.nf));
    if (d.cat) partes.push(cat(d.cat).r);
    if (d.grupo) partes.push((D.grupos.get(d.grupo) || {}).nome);
    if (d.data) partes.push(d.data, dataLonga(d.data));
    if (typeof d.valor === 'number') partes.push(fmtIn(d.valor), R(d.valor), (d.valor / 100).toFixed(2));
    if (d.de) partes.push(nome(d.de));

  if (it) D.coms.forEach(c => { if (c.alvo === it.id) partes.push(c.texto); });
  return norm(partes.filter(Boolean).join(' · '));
}

function listaAtividade(D) {

async function processarFoto(file) {
  if (!file || !/^image\//.test(file.type)) return toast('Escolha uma imagem.');
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, falha) => { const i = new Image(); i.onload = () => ok(i); i.onerror = falha; i.src = url; });
    const w = img.naturalWidth || img.width, h = img.naturalHeight || img.height, lado = Math.min(w, h);
    if (!lado) throw new Error('imagem');
    const c = document.createElement('canvas'); c.width = c.height = 192; /* recorta o centro em quadrado e reduz */
    c.getContext('2d').drawImage(img, (w - lado) / 2, (h - lado) / 2, lado, lado, 0, 0, 192, 192);
    let q = 0.85, s = c.toDataURL('image/jpeg', q);
    while (s.length > 60000 && q > 0.4) { q -= 0.15; s = c.toDataURL('image/jpeg', q); }
    if (!fotoValida(s)) throw new Error('imagem');
    salvarFoto(s); toast('Foto atualizada.');
  } catch (e) { toast('Não foi possível usar esta imagem. Tente outra (JPG ou PNG).'); }
  finally { URL.revokeObjectURL(url); }
}

function avisoSemEfeito(total, r) {

  if (pagou[EU()] !== r.ok[EU()]) return '';

  const unico = ['a', 'b'].find(p => r.ok[p] === total);
  const txt = unico && r.tipo === 'igual'
    ? `Esta despesa não muda o saldo entre vocês: só ${qm(unico)} participa e foi quem pagou. Para dividir, marque também ${qm(unico === 'a' ? 'b' : 'a')} em “Dividir entre”.`

function barras(itens, cls) {
  const max = Math.max(1, ...itens.map(i => i[1]));
  return itens.map(([r, v]) => `<div class="barra ${cls || ''}"><div><span>${esc(r)}</span><b>${R(v)}</b></div><i style="width:${Math.max(3, Math.round(v / max * 100))}%"></i></div>`).join('');
}
function sheetTotais(D, gid) {
  const g = D.grupos.get(gid);
  const ds = [...D.desp.values()].filter(d => !d.apagada && d.valido && d.grupo === gid);
  if (!ds.length) return `<h2>Totais de ${esc(g.nome)}</h2><div class="vazio"><b>Sem despesas</b>Registre despesas para ver os totais.</div><div class="acoes"><button class="btn-sec" data-a="fecharSheet">Fechar</button></div>`;
  const total = ds.reduce((s, d) => s + d.valor, 0);
  const porCat = new Map(), porMes = new Map(); const pagou = { a: 0, b: 0 }, parte = { a: 0, b: 0 };
  for (const d of ds) {
    porCat.set(d.cat, (porCat.get(d.cat) || 0) + d.valor);
    porMes.set(d.data.slice(0, 7), (porMes.get(d.data.slice(0, 7)) || 0) + d.valor);
    pagou.a += d.pagou.a; pagou.b += d.pagou.b; parte.a += d.devido.a; parte.b += d.devido.b;
  }
  const cats = [...porCat].sort((x, y) => y[1] - x[1]).map(([id, v]) => [cat(id).e + ' ' + cat(id).r, v]);
  const meses = [...porMes].sort((x, y) => x[0].localeCompare(y[0])).slice(-6).map(([k, v]) => [rotuloMes(k), v]);
  const pes = [EU(), OUT()];
  return `<h2>Totais de ${esc(g.nome)}</h2><p class="meta" style="margin:-8px 0 8px;color:var(--suave)">Total gasto: <b style="color:var(--tinta)">${R(total)}</b></p>

  <p class="sub">Por mês</p>${barras(meses, 'b')}
  <p class="sub">Quanto cada um pagou</p>${barras(pes.map(p => [quem(p), pagou[p]]))}
  <p class="sub">Parte de cada um nas despesas</p>${barras(pes.map(p => [quem(p), parte[p]]), 'b')}
  <div class="acoes"><button class="btn-sec" data-a="fecharSheet">Fechar</button></div>`;
}

function baixar(nomeArq, conteudo, tipo) {
  const url = URL.createObjectURL(new Blob([conteudo], { type: tipo }));
  const a = document.createElement('a'); a.href = url; a.download = nomeArq;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function csvLinhas(D, gid) {
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const n = c => (c / 100).toFixed(2).replace('.', ',');
  const A = nome('a'), B = nome('b');
  /* o CSV é o registro: inclui também o que ainda espera confirmação, com o estado de cada linha */
  const estado = x => (!x.valido ? 'Aguardando confirmação' : x.exclusaoPendente ? 'Exclusão pendente' : x.st === 'pendente' ? 'Alteração pendente' : 'Confirmado');
  const rows = [['Data', 'Tipo', 'Grupo', 'Descrição', 'Categoria', 'Valor (R$)', `Pagou ${A}`, `Pagou ${B}`, `Parte ${A}`, `Parte ${B}`, 'Observação', 'Estado', 'Empresa (nota fiscal)', 'CNPJ', 'Link da nota fiscal'].map(q).join(';')];
  const nfCols = x => { const i = nfInfo(x.nf); return i ? [i.empresa, i.cnpjFmt, i.url] : ['', '', '']; };
  const todos = [
    ...[...D.desp.values()].filter(d => !d.apagada && (!gid || d.grupo === gid)).map(d => ({ data: d.data, ts: d.ts, l: [d.data, 'Despesa', (D.grupos.get(d.grupo) || {}).nome, d.desc, cat(d.cat).r, n(d.valor), n(d.pagou.a), n(d.pagou.b), n(d.devido.a), n(d.devido.b), d.nota || '', estado(d), ...nfCols(d)] })),
    ...[...D.pag.values()].filter(p => !p.apagado && (!gid || p.grupo === gid)).map(p => ({ data: p.data, ts: p.ts, l: [p.data, 'Pagamento', (D.grupos.get(p.grupo) || {}).nome, `${nome(p.de)} pagou ${nome(p.para)}`, p.forma || '', n(p.valor), '', '', '', '', '', estado(p), '', '', ''] }))
  ].sort((x, y) => x.data.localeCompare(y.data) || x.ts - y.ts);
  todos.forEach(t => rows.push(t.l.map(q).join(';')));
  return '\ufeff' + rows.join('\r\n');
}
async function importarArquivo(file) {
  try {
    const j = JSON.parse(await file.text());
    if (!j || !Array.isArray(j.eventos)) throw new Error('formato');
    const ids = new Set(data.eventos.map(e => e.id)); let n = 0;
    for (const e of j.eventos) if (eventoValido(e) && !ids.has(e.id)) { data.eventos.push(e); ids.add(e.id); n++; }
    store.save(data); toast(n ? `${n} registros novos importados.` : 'Nada novo para importar.'); fim();
  } catch (err) { toast('Arquivo inválido. Use um backup do Equilibra.'); }
}

/* ============================================================
   BOTÃO VOLTAR (Android)
   Fora da tela principal, o app guarda um passo no histórico do
   navegador. O "voltar" fecha a folha aberta, sai do detalhe ou
   volta para a tela principal; só lá ele sai do app.

let passoHist = false, ignorarPop = false;
const naPrincipal = () => !camAtual && !ui.entrada && $('#sheet').hidden && (!data || (!ui.view && ui.tab === 'grupos'));
function ajustarHistorico() {
  try {
    const fora = !naPrincipal();
    if (fora && !passoHist) { history.pushState({ eq: 1 }, ''); passoHist = true; }
    else if (!fora && passoHist) {
      /* voltou pela própria tela: tira o passo extra (depois de um instante, caso outra folha abra em seguida) */
      setTimeout(() => { if (passoHist && naPrincipal()) { passoHist = false; ignorarPop = true; history.back(); } }, 0);
    }
  } catch (e) {}
}
window.addEventListener('popstate', () => {
  if (ignorarPop) { ignorarPop = false; return; }
  passoHist = false;

  else if (ui.entrada) AC.cancelarEntrada();
  else if (ui.view) AC.voltar();
