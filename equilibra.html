<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e8a7b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Equilibra</title>
<style>
:root{
  --verde:#0e8a7b; --verde-esc:#0a6a5e; --verde-claro:#e2f4f1;
  --tinta:#1b2a28; --suave:#5d716d; --linha:#e1e9e7; --fundo:#eef3f2; --papel:#fff;
  --deve:#c9481a; --deve-bg:#fdece4; --recebe:#1a7f45; --recebe-bg:#e5f5ec;
}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;color:var(--tinta);background:var(--fundo)}
body.trava{overflow:hidden}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--papel);position:relative;padding-bottom:calc(132px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;text-align:inherit}
:focus-visible{outline:3px solid #f5b400;outline-offset:2px}

/* topo */
.topo{background:var(--verde);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 8px 12px 16px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:5;min-height:56px}
.topo h1{font-size:19px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topo.marca{padding-left:16px}
.topo .logo{display:inline-flex;color:#fff}
.ic{width:44px;height:44px;border-radius:50%;color:#fff;font-size:26px;line-height:1;display:grid;place-items:center;text-align:center}
.ic:active{background:rgba(255,255,255,.18)}

/* saldo */
.banner{margin:16px;padding:18px;border-radius:16px}
.banner.recebe{background:var(--recebe-bg);color:var(--recebe)}
.banner.deve{background:var(--deve-bg);color:var(--deve)}
.banner.quite{background:var(--verde-claro);color:var(--verde-esc)}
.banner .rotulo{font-size:14px;opacity:.85}
.banner .grande{font-size:22px;font-weight:700;margin:2px 0 0;line-height:1.25}
.banner .btn{margin-top:14px}
.sec{font-size:15px;font-weight:700;color:var(--suave);padding:8px 16px 4px}

/* botões */
.btn{background:var(--verde);color:#fff;border-radius:12px;padding:12px 18px;font-weight:700;min-height:46px;display:inline-flex;align-items:center;justify-content:center;text-align:center}
.btn:active{background:var(--verde-esc)}
.btn-sec{border:2px solid var(--verde);color:var(--verde-esc);border-radius:12px;padding:10px 16px;font-weight:700;min-height:46px;display:inline-flex;align-items:center;justify-content:center;text-align:center;background:#fff}
.btn.perigo{background:var(--deve)}
.btn-txt{color:var(--deve);font-weight:700;padding:12px;min-height:44px}
.cheio{display:flex;width:calc(100% - 32px);margin:14px 16px}
.acoes{display:flex;gap:10px;margin-top:18px}
.acoes>*{flex:1}
.fab{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom));right:max(16px,calc(50% - 224px));background:var(--verde);color:#fff;border-radius:999px;padding:14px 22px;font-weight:700;box-shadow:0 6px 18px rgba(10,106,94,.35);z-index:6;min-height:50px}
.fab.sozinho{bottom:calc(24px + env(safe-area-inset-bottom))}
.fab:active{background:var(--verde-esc)}

/* listas */
.linha{display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;border-bottom:1px solid var(--linha);min-height:64px}
.linha:active{background:var(--fundo)}
.linha .ico{width:42px;height:42px;border-radius:12px;background:var(--verde-claro);display:grid;place-items:center;font-size:21px;flex:none}
.linha .mid{flex:1;min-width:0}
.linha .t{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.linha .s{display:block;font-size:14px;color:var(--suave)}
.linha .dir{text-align:right;flex:none}
.linha .dir small{display:block;font-size:12px}
.linha .dir b{font-size:16px}
.recebe{color:var(--recebe)} .deve{color:var(--deve)} .quite{color:var(--suave)}
.linha .dt{width:34px;text-align:center;flex:none;line-height:1.1}
.linha .dt b{display:block;font-size:17px}
.linha .dt span{font-size:12px;color:var(--suave)}
.linha.pag{background:#f7faf9}
.linha.pag .ico{background:#e8efed}
.mes{padding:14px 16px 6px;font-size:14px;font-weight:700;color:var(--suave);text-transform:capitalize;background:var(--fundo)}
.vazio{padding:36px 24px;text-align:center;color:var(--suave)}
.vazio b{display:block;color:var(--tinta);font-size:17px;margin-bottom:4px}

/* grupo */
.faixa{display:flex;gap:8px;padding:0 16px 12px;overflow-x:auto}
.faixa button{flex:none;border:1.5px solid var(--linha);border-radius:999px;padding:9px 16px;font-weight:600;font-size:14px;min-height:42px;background:#fff}
.busca{padding:0 16px 12px}
.busca input{width:100%;border:1.5px solid var(--linha);border-radius:12px;padding:11px 14px;background:#fff}

/* detalhe */
.cartao{margin:16px;padding:18px;border:1.5px solid var(--linha);border-radius:16px}
.cartao .ico{width:52px;height:52px;border-radius:14px;background:var(--verde-claro);display:grid;place-items:center;font-size:26px;margin-bottom:10px}
.cartao h2{font-size:21px;line-height:1.25}
.cartao .valor{font-size:30px;font-weight:800;margin:2px 0 6px}
.cartao .meta{font-size:14px;color:var(--suave)}
.pessoa{display:flex;justify-content:space-between;gap:12px;padding:10px 16px;border-bottom:1px solid var(--linha)}
.pessoa span:last-child{text-align:right;color:var(--suave);font-size:14px}
.selo{display:inline-block;background:var(--verde-claro);color:var(--verde-esc);border-radius:8px;padding:3px 9px;font-size:13px;font-weight:600;margin-top:8px}
.coment{padding:10px 16px;border-bottom:1px solid var(--linha)}
.coment small{color:var(--suave)}
.escrever{display:flex;gap:8px;padding:12px 16px}
.escrever input{flex:1;min-width:0;border:1.5px solid var(--linha);border-radius:12px;padding:11px 14px}

/* atividade */
.ativ{padding:12px 16px;border-bottom:1px solid var(--linha)}
.ativ p{line-height:1.35}
.ativ small{color:var(--suave);display:block;margin-top:2px}

/* formulários */
.sheet-wrap{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(18,38,34,.5)}
.sheet{position:relative;width:100%;max-width:480px;max-height:92vh;max-height:92dvh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));animation:sobe .22s ease-out}
@keyframes sobe{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.sheet h2{font-size:20px;margin-bottom:14px}
.campo{display:block;margin-bottom:14px}
.campo>span,.campo>label{display:block;font-size:14px;font-weight:600;color:var(--suave);margin-bottom:5px}
.campo input,.campo select,.campo textarea{width:100%;border:1.5px solid var(--linha);border-radius:12px;padding:12px 14px;background:#fff;min-height:48px}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.moeda{display:flex;align-items:center;border:1.5px solid var(--linha);border-radius:12px;padding-left:14px;background:#fff}
.moeda b{color:var(--suave);font-weight:600}
.moeda input{border:0!important;min-width:0;flex:1;padding-left:8px!important}
.chk{display:flex;align-items:center;gap:10px;padding:10px 0;min-height:44px}
.chk input{width:22px;height:22px;accent-color:var(--verde)}
.dica{font-size:14px;color:var(--suave);margin:-4px 0 14px;min-height:20px}
.erro{background:var(--deve-bg);color:#8f3210;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.opcao{display:flex;width:100%;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--linha);font-weight:600;min-height:52px}
.barra{margin:0 0 12px}
.barra div{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-bottom:4px}
.barra i{display:block;height:9px;border-radius:5px;background:var(--verde)}
.barra.b i{background:#7cc6bc}
.sub{font-size:15px;font-weight:700;margin:18px 0 10px}

/* navegação */
/* tipos de grupo e ícones */
.tipos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.tipo-chip{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:5px;border:1.5px solid var(--linha);border-radius:12px;padding:10px 4px;min-height:78px;font-size:12px;font-weight:600;text-align:center;line-height:1.15;background:#fff}
.tipo-chip .ci{display:grid;place-items:center;height:30px;font-size:24px;line-height:1}
.tipo-chip.on{border-color:var(--verde);background:var(--verde-claro);color:var(--verde-esc)}
.tipo-chip.novo{border-style:dashed;color:var(--verde-esc);justify-content:center}
.grade-ic{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:14px}
.grade-ic button{display:grid;place-items:center;min-height:46px;border:1.5px solid var(--linha);border-radius:10px;font-size:22px;background:#fff}
.grade-ic button.on{border-color:var(--verde);background:var(--verde-claro)}
.previa{display:flex;align-items:center;gap:12px;min-height:54px;padding:10px 14px;border:1.5px solid var(--linha);border-radius:12px;margin-bottom:6px;color:var(--suave);font-size:14px}
.previa b{color:var(--tinta);font-size:16px}
.previa .pi{display:grid;place-items:center;min-width:34px;font-size:28px}
.tipo-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--linha)}
.tipo-item span{display:flex;align-items:center;gap:10px;font-size:16px;min-width:0}
.linha .ico svg{display:block}

.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid var(--linha);display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:env(safe-area-inset-bottom);z-index:7}
.nav button{padding:8px 4px 9px;text-align:center;font-size:12px;font-weight:600;color:var(--suave);min-height:60px}
.nav button span{display:block;font-size:22px;line-height:1.2}
.nav button.on{color:var(--verde-esc)}

/* boas-vindas */
.boas{padding:calc(56px + env(safe-area-inset-top)) 24px 32px}
.boas .logo{color:var(--verde);display:inline-flex;margin-bottom:12px}
.boas h1{font-size:34px;letter-spacing:-.5px}
.boas p{color:var(--suave);margin:8px 0 28px;font-size:17px}

/* conta */
.caixa{margin:16px;padding:14px 16px;border-radius:14px;background:var(--verde-claro);color:var(--verde-esc);font-size:15px}
.bloco{padding:6px 16px 10px}
.bloco h2{font-size:15px;color:var(--suave);margin:14px 0 8px}

.ic{position:relative}
.ic.pend::after{content:"";position:absolute;top:8px;right:8px;width:11px;height:11px;border-radius:50%;background:#ffb020;border:2px solid var(--verde)}
.explica{font-size:14px;color:var(--suave);margin:4px 0 10px}
.estado{font-weight:700;margin:6px 0 2px}
.estado.ok{color:var(--recebe)} .estado.falta{color:var(--deve)}
.ou{text-align:center;color:var(--suave);margin:18px 0 12px;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(130px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1b2a28;color:#fff;padding:11px 18px;border-radius:12px;z-index:30;font-size:15px;max-width:90%;text-align:center}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
@media (min-width:520px){body{padding:0}#app{box-shadow:0 0 0 1px var(--linha)}}
.ativ[data-a]{cursor:pointer}
/* cores: amarelo = esperando confirmação; verde = a favor de quem usa o aparelho; vermelho = contra */
.ativ.pend,.linha.pend,.linha.pag.pend{background:#fff6d6}
.ativ.ativo{background:var(--recebe-bg)}
.ativ.passivo{background:var(--deve-bg)}
.ativ{position:relative}
.ativ.pend{padding-right:44px}
.ativ .ampulheta{position:absolute;right:14px;bottom:10px;font-size:18px;line-height:1}
.faixa button{position:relative}
.faixa button.on{border-color:var(--verde);background:var(--verde-claro);color:var(--verde-esc)}
.faixa button.ponto::after{content:"";position:absolute;top:3px;right:3px;width:10px;height:10px;border-radius:50%;background:var(--deve);border:2px solid #fff}
.qr{display:flex;justify-content:center;margin:14px 0 6px}
.qr svg{width:min(270px,72vw);height:auto;border-radius:8px;transition:opacity .3s}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.st{font-weight:700}
.st.pend{color:#8a6400}.st.ok{color:var(--verde-esc)}.st.rec{color:var(--suave)}
.dir.espera{color:#8a6400}
.banner .pendente{margin-top:12px;padding:9px 12px;border-radius:10px;background:#fff6d6;color:#6e5000;font-size:14px;line-height:1.35}
.stbox{margin:12px 16px;padding:12px 14px;border-radius:12px;background:var(--fundo)}
.stbox.pend{background:#fff6d6;color:#6e5000}.stbox.ok{background:var(--fundo);color:var(--verde-esc)}.stbox.rec{background:var(--fundo);color:var(--suave)}
.hist{padding:10px 16px;border-bottom:1px solid var(--linha)}
.hist small{display:block;color:var(--suave)}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet" class="sheet-wrap" hidden>
  <div class="sheet-bg" data-a="fecharSheet"></div>
  <div class="sheet" role="dialog" aria-modal="true" id="sheetBody"></div>
</div>
<div id="toast" class="toast" role="status" hidden></div>
<input type="file" id="arquivo" accept="application/json,.json" hidden>
<noscript>O Equilibra precisa de JavaScript para funcionar.</noscript>

<script>
(() => {
'use strict';

/* ============================================================
   ARMAZENAMENTO
   Hoje: neste aparelho. A estrutura (lista de eventos) já está
   usada também na sincronização entre os dois celulares.
   ============================================================ */
const KEY = 'equilibra:v1';
let mem = null;
const store = {
  load() { try { const s = localStorage.getItem(KEY); if (s) return JSON.parse(s); } catch (e) {} return mem; },
  save(d) { mem = d; try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) {} }
};
let data = store.load();
const ui = { tab: 'grupos', view: null, busca: '', sync: { estado: '', msg: '' } };
let sheetEstado = null;
let confirmCb = null;
let pararSheet = null; /* desliga câmera ou temporizador da folha aberta */

/* ============================================================
   UTILITÁRIOS
   ============================================================ */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const brl = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
const R = c => brl.format(c / 100);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const hoje = () => ymd(new Date());
const dataLonga = iso => new Date(iso + 'T12:00:00').toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });
const diaMes = iso => { const d = new Date(iso + 'T12:00:00'); return { d: String(d.getDate()).padStart(2, '0'), m: d.toLocaleDateString('pt-BR', { month: 'short' }).replace('.', '') }; };
const rotuloMes = k => new Date(k + '-15T12:00:00').toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
const quando = ts => new Date(ts).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
const fmtIn = c => (c / 100).toFixed(2).replace('.', ',');
const rolar = () => window.scrollTo(0, 0);

function parseValor(s) {
  s = String(s || '').trim().replace(/[R$\s]/g, '');
  if (!s) return NaN;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  const n = Number(s);
  return isFinite(n) ? Math.round(n * 100) : NaN;
}
function addMeses(iso, n) {
  const [y, m, d] = iso.split('-').map(Number);
  const t = new Date(y, m - 1 + n, 1);
  const ult = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate();
  t.setDate(Math.min(d, ult));
  return ymd(t);
}
function addDias(iso, n) { const t = new Date(iso + 'T12:00:00'); t.setDate(t.getDate() + n); return ymd(t); }

let toastT;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2600);
}

const LOGO = '<svg viewBox="0 0 48 48" width="30" height="30" aria-hidden="true"><circle cx="10" cy="15" r="6" fill="currentColor"/><circle cx="38" cy="15" r="6" fill="currentColor"/><rect x="4" y="21" width="40" height="4" rx="2" fill="currentColor"/><path d="M24 25 L16 42 H32 Z" fill="currentColor"/></svg>';

const CATS = [
  { id: 'mercado', r: 'Mercado', e: '🛒' },
  { id: 'restaurante', r: 'Restaurantes e bares', e: '🍽️' },
  { id: 'moradia', r: 'Aluguel e moradia', e: '🏠' },
  { id: 'contas', r: 'Contas (luz, água, internet)', e: '💡' },
  { id: 'transporte', r: 'Transporte', e: '🚗' },
  { id: 'lazer', r: 'Lazer', e: '🎬' },
  { id: 'viagem', r: 'Viagem', e: '✈️' },
  { id: 'saude', r: 'Saúde', e: '💊' },
  { id: 'compras', r: 'Compras', e: '🛍️' },
  { id: 'presente', r: 'Presentes', e: '🎁' },
  { id: 'pet', r: 'Pets', e: '🐾' },
  { id: 'geral', r: 'Geral', e: '🧾' }
];
const cat = id => CATS.find(c => c.id === id) || CATS[CATS.length - 1];
const CARTOES = [
  { id: 'laranja', r: 'Laranja', c: '#ff7a00' },
  { id: 'vermelho', r: 'Vermelho', c: '#d62839' },
  { id: 'roxo', r: 'Roxo', c: '#7b2fbe' },
  { id: 'azul', r: 'Azul', c: '#1f6feb' },
  { id: 'verde', r: 'Verde', c: '#1e9e5a' },
  { id: 'rosa', r: 'Rosa', c: '#e0479e' },
  { id: 'amarelo', r: 'Amarelo', c: '#f2b01e' },
  { id: 'preto', r: 'Preto', c: '#2b2f33' },
  { id: 'turquesa', r: 'Turquesa', c: '#0e8a7b' },
  { id: 'cinza', r: 'Cinza', c: '#7a8793' },
  { id: 'marrom', r: 'Marrom', c: '#8d5524' },
  { id: 'vinho', r: 'Vinho', c: '#8e1b3a' }
];
const EMOJIS = ['🏠', '🏢', '🔑', '💡', '⚡', '💧', '🚿', '🔥', '🌐', '📶', '📱', '📺',
  '🎬', '🎵', '🛒', '🍽️', '☕', '🚗', '⛽', '🚌', '✈️', '🏖️', '💊', '🏥',
  '🐾', '🎁', '👶', '🎓', '🏋️', '💈', '🧾', '💰', '🏦', '💳', '🧺', '🛠️',
  '🌱', '🎉', '❤️', '📌', '⭐', '🛍️', '🧹', '🍕', '🎮', '📚', '🚲', '🏷️'];
const TIPOS_BASE = [
  { id: 'b-casa', nome: 'Casa', icone: '🏠' },
  { id: 'b-viagem', nome: 'Viagem', icone: '✈️' },
  { id: 'b-casal', nome: 'Casal', icone: '❤️' },
  { id: 'b-compras', nome: 'Compras', icone: '🛒' },
  { id: 'b-inter', nome: 'Cartão de crédito Inter', icone: 'card:laranja' },
  { id: 'b-energia', nome: 'Conta de energia', icone: '⚡' },
  { id: 'b-agua', nome: 'Conta de água', icone: '💧' },
  { id: 'b-internet', nome: 'Internet', icone: '🌐' },
  { id: 'b-gas', nome: 'Gás', icone: '🔥' },

  return -net(r.antes);
}
/* cores da atividade: amarelo = esperando confirmação; verde = a seu favor; vermelho = contra você */

  if (r.st === 'pendente' && !r.sup) return 'pend';

  const v = efeitoRev(r);
  return v > 0 ? 'ativo' : v < 0 ? 'passivo' : '';
}
function gruposAtivos(D) {

/* ============================================================
   DIVISÃO (valores em centavos, sem erro de arredondamento)
   ============================================================ */
function calcDevido(tipo, total, ent, id) {
  if (tipo === 'igual') {
    const q = ent.quem || [];
    if (!q.length) return { erro: 'Escolha pelo menos uma pessoa para dividir.' };
    if (q.length === 1) return { ok: { a: q[0] === 'a' ? total : 0, b: q[0] === 'b' ? total : 0 } };
    const par = [...String(id)].reduce((s, c) => s + c.charCodeAt(0), 0) % 2;
    const metade = Math.floor(total / 2), sobra = total - metade * 2;
    return { ok: { a: metade + (par === 0 ? sobra : 0), b: metade + (par === 1 ? sobra : 0) } };
  }
  if (tipo === 'exato') {
    if (ent.a + ent.b !== total) return { erro: `Os valores somam ${R(ent.a + ent.b)}, mas a despesa é de ${R(total)}.` };
    return { ok: { a: ent.a, b: ent.b } };
  }
  if (tipo === 'percent') {
    if (Math.abs(ent.a + ent.b - 100) > 0.001) return { erro: `As porcentagens somam ${ent.a + ent.b}%. Precisam somar 100%.` };
    const a = Math.round(total * ent.a / 100);
    return { ok: { a, b: total - a } };
  }
  if (tipo === 'partes') {
    if (ent.a < 0 || ent.b < 0 || ent.a + ent.b <= 0) return { erro: 'Informe as partes de cada um.' };
    const a = Math.round(total * ent.a / (ent.a + ent.b));
    return { ok: { a, b: total - a } };
  }
  return { erro: 'Tipo de divisão inválido.' };
}

/* ============================================================
   DESPESAS RECORRENTES
   Ids determinísticos (id@data): se os dois celulares gerarem,
   a mesclagem não duplica.
   ============================================================ */
const CAMPOS = ['grupo', 'desc', 'valor', 'cat', 'pagouModo', 'pagou', 'tipo', 'ent', 'devido', 'nota'];
function gerarRecorrentes() {
  const D = derivar();
  const ids = new Set(data.eventos.map(e => e.id));
  const h = hoje(); let novos = 0;
  for (const d of D.desp.values()) {
    if (d.apagada || !d.valido || !d.rec || d.origem) continue; /* só repete despesas já confirmadas */
    for (let i = 1; i < 600; i++) {
      const dt = d.rec === 'mensal' ? addMeses(d.data, i) : addDias(d.data, 7 * i);
      if (dt > h) break;
      const id = d.id + '@' + dt;
      if (ids.has(id)) continue;
      const dados = { data: dt, rec: null, origem: d.id };
      CAMPOS.forEach(k => { dados[k] = d[k]; });
      data.eventos.push({ id, tipo: 'despesa', autor: d.autor, ts: new Date(dt + 'T12:00:00').getTime(), dados });
      ids.add(id); novos++;
    }
  }
  if (novos) store.save(data);
}
function fim() { if (data) gerarRecorrentes(); render(); agendarSync(); verificarTudo(); }

/* --- totais --- */
function barras(itens, cls) {
  const max = Math.max(1, ...itens.map(i => i[1]));
  return itens.map(([r, v]) => `<div class="barra ${cls || ''}"><div><span>${esc(r)}</span><b>${R(v)}</b></div><i style="width:${Math.max(3, Math.round(v / max * 100))}%"></i></div>`).join('');
}
function sheetTotais(D, gid) {
  const g = D.grupos.get(gid);
  const ds = [...D.desp.values()].filter(d => !d.apagada && d.valido && d.grupo === gid);
  if (!ds.length) return `<h2>Totais de ${esc(g.nome)}</h2><div class="vazio"><b>Sem despesas</b>Registre despesas para ver os totais.</div><div class="acoes"><button class="btn-sec" data-a="fecharSheet">Fechar</button></div>`;
  const total = ds.reduce((s, d) => s + d.valor, 0);
  const porCat = new Map(), porMes = new Map(); const pagou = { a: 0, b: 0 }, parte = { a: 0, b: 0 };
  for (const d of ds) {
    porCat.set(d.cat, (porCat.get(d.cat) || 0) + d.valor);
    porMes.set(d.data.slice(0, 7), (porMes.get(d.data.slice(0, 7)) || 0) + d.valor);
    pagou.a += d.pagou.a; pagou.b += d.pagou.b; parte.a += d.devido.a; parte.b += d.devido.b;
  }
  const cats = [...porCat].sort((x, y) => y[1] - x[1]).map(([id, v]) => [cat(id).e + ' ' + cat(id).r, v]);
  const meses = [...porMes].sort((x, y) => x[0].localeCompare(y[0])).slice(-6).map(([k, v]) => [rotuloMes(k), v]);
  const pes = [EU(), OUT()];
  return `<h2>Totais de ${esc(g.nome)}</h2><p class="meta" style="margin:-8px 0 8px;color:var(--suave)">Total gasto: <b style="color:var(--tinta)">${R(total)}</b></p>
  <p class="sub">Por categoria</p>${barras(cats)}
  <p class="sub">Por mês</p>${barras(meses, 'b')}
  <p class="sub">Quanto cada um pagou</p>${barras(pes.map(p => [quem(p), pagou[p]]))}
  <p class="sub">Parte de cada um nas despesas</p>${barras(pes.map(p => [quem(p), parte[p]]), 'b')}
  <div class="acoes"><button class="btn-sec" data-a="fecharSheet">Fechar</button></div>`;
}

/* ============================================================
   EXPORTAÇÃO / IMPORTAÇÃO
   ============================================================ */
function baixar(nomeArq, conteudo, tipo) {
  const url = URL.createObjectURL(new Blob([conteudo], { type: tipo }));
  const a = document.createElement('a'); a.href = url; a.download = nomeArq;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function csvLinhas(D, gid) {
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const n = c => (c / 100).toFixed(2).replace('.', ',');
  const A = nome('a'), B = nome('b');
  /* o CSV é o registro: inclui também o que ainda espera confirmação, com o estado de cada linha */
  const estado = x => (!x.valido ? 'Aguardando confirmação' : x.exclusaoPendente ? 'Exclusão pendente' : x.st === 'pendente' ? 'Alteração pendente' : 'Confirmado');
  const rows = [['Data', 'Tipo', 'Grupo', 'Descrição', 'Categoria', 'Valor (R$)', `Pagou ${A}`, `Pagou ${B}`, `Parte ${A}`, `Parte ${B}`, 'Observação', 'Estado'].map(q).join(';')];
  const todos = [
    ...[...D.desp.values()].filter(d => !d.apagada && (!gid || d.grupo === gid)).map(d => ({ data: d.data, ts: d.ts, l: [d.data, 'Despesa', (D.grupos.get(d.grupo) || {}).nome, d.desc, cat(d.cat).r, n(d.valor), n(d.pagou.a), n(d.pagou.b), n(d.devido.a), n(d.devido.b), d.nota || '', estado(d)] })),
    ...[...D.pag.values()].filter(p => !p.apagado && (!gid || p.grupo === gid)).map(p => ({ data: p.data, ts: p.ts, l: [p.data, 'Pagamento', (D.grupos.get(p.grupo) || {}).nome, `${nome(p.de)} pagou ${nome(p.para)}`, p.forma || '', n(p.valor), '', '', '', '', '', estado(p)] }))
  ].sort((x, y) => x.data.localeCompare(y.data) || x.ts - y.ts);
  todos.forEach(t => rows.push(t.l.map(q).join(';')));
  return '\ufeff' + rows.join('\r\n');
}
async function importarArquivo(file) {
  try {
    const j = JSON.parse(await file.text());
    if (!j || !Array.isArray(j.eventos)) throw new Error('formato');
    const ids = new Set(data.eventos.map(e => e.id)); let n = 0;
    for (const e of j.eventos) if (e && e.id && e.tipo && !ids.has(e.id)) { data.eventos.push(e); ids.add(e.id); n++; }
    store.save(data); toast(n ? `${n} registros novos importados.` : 'Nada novo para importar.'); fim();
  } catch (err) { toast('Arquivo inválido. Use um backup do Equilibra.'); }
}

  },
  tab(d) { ui.tab = d.t; ui.view = null; ui.busca = ''; render(); rolar(); },

  abrirGrupo(d) { ui.view = { t: 'grupo', id: d.id }; ui.busca = ''; render(); rolar(); },

    else ui.view = null;

/* ============================================================
   CÓDIGO QR (gerador próprio, sem internet: modo byte,
   correção de erros nível M, versões 1 a 15)
   ============================================================ */
const QR = (() => {
  /* blocos por versão: [qtd, total, dados] (+ segundo grupo) */
  const BLOCOS = [null, [1, 26, 16], [1, 44, 28], [1, 70, 44], [2, 50, 32], [2, 67, 43], [4, 43, 27], [4, 49, 31], [2, 60, 38, 2, 61, 39], [3, 58, 36, 2, 59, 37], [4, 69, 43, 1, 70, 44], [1, 80, 50, 4, 81, 51], [6, 58, 36, 2, 59, 37], [8, 59, 37, 1, 60, 38], [4, 64, 40, 5, 65, 41], [5, 65, 41, 5, 66, 42]];
  const ALINH = [null, [], [6, 18], [6, 22], [6, 26], [6, 30], [6, 34], [6, 22, 38], [6, 24, 42], [6, 26, 46], [6, 28, 50], [6, 30, 54], [6, 32, 58], [6, 34, 62], [6, 26, 46, 66], [6, 26, 48, 70]];
  const EXP = new Array(512), LOG = new Array(256);
  for (let i = 0, x = 1; i < 255; i++) { EXP[i] = x; LOG[x] = i; x <<= 1; if (x & 256) x ^= 0x11d; }
  for (let i = 255; i < 512; i++) EXP[i] = EXP[i - 255];
  const mul = (a, b) => (a && b ? EXP[LOG[a] + LOG[b]] : 0);
  function rs(dados, n) {
    let g = [1];
    for (let i = 0; i < n; i++) { const ng = new Array(g.length + 1).fill(0); g.forEach((c, j) => { ng[j] ^= c; ng[j + 1] ^= mul(c, EXP[i]); }); g = ng; }
    const r = dados.concat(new Array(n).fill(0));
    for (let i = 0; i < dados.length; i++) { const c = r[i]; if (c) for (let j = 1; j < g.length; j++) r[i + j] ^= mul(g[j], c); }
    return r.slice(dados.length);
  }
  const bits = d => { let n = 0; while (d) { n++; d >>>= 1; } return n; };
  const bch = (v, g, k) => { let d = v << k; while (bits(d) - bits(g) >= 0) d ^= g << (bits(d) - bits(g)); return (v << k) | d; };
  const MASK = [(i, j) => (i + j) % 2 === 0, i => i % 2 === 0, (i, j) => j % 3 === 0, (i, j) => (i + j) % 3 === 0,
    (i, j) => (Math.floor(i / 2) + Math.floor(j / 3)) % 2 === 0, (i, j) => (i * j) % 2 + (i * j) % 3 === 0,
    (i, j) => ((i * j) % 2 + (i * j) % 3) % 2 === 0, (i, j) => ((i * j) % 3 + (i + j) % 2) % 2 === 0];

  function codewords(texto) {
    const bytes = [...new TextEncoder().encode(texto)];
    let v = 1;
    const cap = b => b[0] * b[2] + (b[3] || 0) * (b[5] || 0);
    while (v <= 15 && 4 + (v < 10 ? 8 : 16) + bytes.length * 8 > cap(BLOCOS[v]) * 8) v++;
    if (v > 15) throw new Error('qr-grande');
    const b = BLOCOS[v], total = cap(b), bs = [];
    const put = (x, n) => { for (let i = n - 1; i >= 0; i--) bs.push((x >>> i) & 1); };
    put(4, 4); put(bytes.length, v < 10 ? 8 : 16); bytes.forEach(x => put(x, 8));
    for (let i = 0; i < 4 && bs.length < total * 8; i++) bs.push(0);
    while (bs.length % 8) bs.push(0);
    const cw = [];
    for (let i = 0; i < bs.length; i += 8) cw.push(parseInt(bs.slice(i, i + 8).join(''), 2));
    for (let p = 0; cw.length < total; p++) cw.push(p % 2 ? 0x11 : 0xec);
    const grupos = [[b[0], b[1], b[2]]]; if (b[3]) grupos.push([b[3], b[4], b[5]]);
    const blocos = []; let pos = 0;
    grupos.forEach(([n, tot, dc]) => { for (let i = 0; i < n; i++) { const d = cw.slice(pos, pos + dc); pos += dc; blocos.push({ d, e: rs(d, tot - dc) }); } });
    const out = [], maxD = Math.max(...blocos.map(x => x.d.length));
    for (let i = 0; i < maxD; i++) blocos.forEach(x => { if (i < x.d.length) out.push(x.d[i]); });
    for (let i = 0; i < blocos[0].e.length; i++) blocos.forEach(x => out.push(x.e[i]));
    return { v, out };
  }
  function montar(v, dados, mask) {
    const n = 17 + 4 * v, m = Array.from({ length: n }, () => new Array(n).fill(null));
    const finder = (r0, c0) => {
      for (let r = -1; r <= 7; r++) for (let c = -1; c <= 7; c++) {
        const R = r0 + r, C = c0 + c; if (R < 0 || C < 0 || R >= n || C >= n) continue;
        m[R][C] = (r >= 0 && r <= 6 && (c === 0 || c === 6)) || (c >= 0 && c <= 6 && (r === 0 || r === 6)) || (r >= 2 && r <= 4 && c >= 2 && c <= 4);
      }
    };
    finder(0, 0); finder(0, n - 7); finder(n - 7, 0);
    for (const r of ALINH[v]) for (const c of ALINH[v]) {
      if (m[r][c] !== null) continue;
      for (let i = -2; i <= 2; i++) for (let j = -2; j <= 2; j++) m[r + i][c + j] = Math.abs(i) === 2 || Math.abs(j) === 2 || (i === 0 && j === 0);
    }
    for (let i = 8; i < n - 8; i++) { if (m[i][6] === null) m[i][6] = i % 2 === 0; if (m[6][i] === null) m[6][i] = i % 2 === 0; }
    const fmt = bch(mask, 0x537, 10) ^ 0x5412; /* nível M = 00 */
    for (let i = 0; i < 15; i++) {
      const d = ((fmt >> i) & 1) === 1;
      if (i < 6) m[i][8] = d; else if (i < 8) m[i + 1][8] = d; else m[n - 15 + i][8] = d;
      if (i < 8) m[8][n - i - 1] = d; else if (i < 9) m[8][15 - i] = d; else m[8][15 - i - 1] = d;
    }
    m[n - 8][8] = true;
    if (v >= 7) {
      const vb = bch(v, 0x1f25, 12);
      for (let i = 0; i < 18; i++) { const d = ((vb >> i) & 1) === 1; m[Math.floor(i / 3)][i % 3 + n - 11] = d; m[i % 3 + n - 11][Math.floor(i / 3)] = d; }
    }
    let inc = -1, row = n - 1, bit = 7, idx = 0;
    for (let col = n - 1; col > 0; col -= 2) {
      if (col === 6) col--;
      for (;;) {
        for (let c = 0; c < 2; c++) {
          if (m[row][col - c] !== null) continue;
          let d = idx < dados.length && ((dados[idx] >>> bit) & 1) === 1;
          if (MASK[mask](row, col - c)) d = !d;
          m[row][col - c] = d;
          if (--bit < 0) { idx++; bit = 7; }
        }
        row += inc;
        if (row < 0 || row >= n) { row -= inc; inc = -inc; break; }
      }
    }
    return m;
  }
  function penalidade(m) {
    const n = m.length; let p = 0, escuros = 0;
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
      let iguais = 0;
      for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) {
        if ((i || j) && r + i >= 0 && r + i < n && c + j >= 0 && c + j < n && m[r + i][c + j] === m[r][c]) iguais++;
      }
      if (iguais > 5) p += 3 + iguais - 5;
      if (r < n - 1 && c < n - 1) { const s = m[r][c] + m[r + 1][c] + m[r][c + 1] + m[r + 1][c + 1]; if (s === 0 || s === 4) p += 3; }
      if (c < n - 6 && m[r][c] && !m[r][c + 1] && m[r][c + 2] && m[r][c + 3] && m[r][c + 4] && !m[r][c + 5] && m[r][c + 6]) p += 40;
      if (r < n - 6 && m[r][c] && !m[r + 1][c] && m[r + 2][c] && m[r + 3][c] && m[r + 4][c] && !m[r + 5][c] && m[r + 6][c]) p += 40;
      if (m[r][c]) escuros++;
    }
    return p + Math.floor(Math.abs(100 * escuros / (n * n) - 50) / 5) * 10;
  }
  function matriz(texto) {
    const { v, out } = codewords(texto);
    let melhor = null, menor = Infinity;
    for (let k = 0; k < 8; k++) { const m = montar(v, out, k), p = penalidade(m); if (p < menor) { menor = p; melhor = m; } }
    return melhor;
  }
  function svg(texto) {
    const m = matriz(texto), n = m.length, q = 4; let d = '';
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (m[r][c]) d += `M${c + q} ${r + q}h1v1h-1z`;
    return `<svg viewBox="0 0 ${n + 2 * q} ${n + 2 * q}" shape-rendering="crispEdges" role="img" aria-label="Código QR"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
  }
  return { svg };
})();

/* ============================================================
   SINCRONIZAÇÃO (mini servidor no Google Apps Script, v2)
   Cada celular tem uma chave própria, criada aqui e nunca
   digitada; o servidor descobre quem é pela chave e guarda um
   arquivo por pessoa, sem nunca apagar eventos. O segundo
   celular entra lendo um QR do primeiro, que autoriza com a
   digital. Não usa login do Google, então nunca expira.
   ============================================================ */
try { localStorage.removeItem('equilibra:token'); } catch (e) {}
let sincronizando = false, syncT = null, bioOcupado = false, entradaId = 0;

/* conexões antigas (com chave secreta digitada) precisam ser ativadas de novo; o endereço é aproveitado */
if (data && data.sync && !data.sync.token) {
  data.sync = { url: data.sync.url || '', token: '', espaco: '', ultima: 0, enviado: '' };
  store.save(data);
}
const syncAtiva = () => !!(data && data.sync && data.sync.url && data.sync.token);
const novaChave = (n = 32) => b64u.enc(crypto.getRandomValues(new Uint8Array(n)));
const URL_SCRIPT = /^https:\/\/script\.google\.com\/macros\/s\/([A-Za-z0-9_-]+)\/exec$/;

function hash(s) { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return String(h) + ':' + s.length; }
function montarMeu() {
  const base = { v: 2, espaco: data.sync.espaco, autor: EU(), config: { nomes: data.config.nomes, ts: data.config.nomesTs || 0 }, eventos: data.eventos.filter(e => e.autor === EU()) };
  return { hash: hash(JSON.stringify(base)), obj: { ...base, atualizado: Date.now() } };
}
/* junta eventos vindos do servidor; só aceita os do autor esperado */
function mesclar(arq, autor) {
  let n = 0; const ids = new Set(data.eventos.map(e => e.id));
  for (const e of (arq.eventos || [])) {
    if (e && e.id && e.tipo && e.autor === autor && !ids.has(e.id)) { data.eventos.push(e); ids.add(e.id); n++; }
  }
  return n;
}
function aplicarNomes(c) {
  if (c && c.nomes && typeof c.nomes.a === 'string' && typeof c.nomes.b === 'string' && (c.ts || 0) > (data.config.nomesTs || 0)) {
    data.config.nomes = { a: c.nomes.a, b: c.nomes.b }; data.config.nomesTs = c.ts;
  }
}
function mesclarDoOutro(arq) { const n = mesclar(arq, OUT()); aplicarNomes(arq.config); return n; }
async function chamar(s, corpo) {
  /* Sem cabeçalhos: o navegador envia como texto simples e o Apps Script aceita sem bloqueio de CORS. */
  const r = await fetch(s.url, { method: 'POST', body: JSON.stringify({ t: s.token, ...corpo }), redirect: 'follow' });
  let j; try { j = await r.json(); } catch (e) { throw new Error('resposta-invalida'); }
  if (!j || !j.ok) throw new Error((j && j.erro) || 'erro-servidor');
  return j;
}
function setSync(estado, msg) { ui.sync = { estado, msg: msg || '' }; }
function renderSeguro() {
  const a = document.activeElement;
  if (a && a.closest && a.closest('#app') && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
  render();
}
const semRede = m => /Failed to fetch|NetworkError|Load failed/.test(m);
function msgErro(e) {
  const m = String((e && e.message) || e);
  if (m === 'chave') return 'Este celular foi desconectado do espaço. Para voltar, peça um QR novo à outra pessoa.';
  if (m === 'ja-configurado') return 'Este servidor já tem um espaço. Para entrar nele, leia o QR de quem já está conectado. Para começar do zero, mova o arquivo “Equilibra - dados v2.json” do seu Google Drive para a lixeira.';
  if (m === 'convite-invalido') return 'QR inválido ou expirado. Peça um QR novo.';
  if (m === 'convite-usado') return 'Este QR já foi lido por outro celular. Peça um QR novo.';
  if (m === 'resposta-invalida') return 'O endereço não respondeu como esperado. Confira se o Apps Script foi publicado (nova versão) com acesso “Qualquer pessoa”.';
  if (m === 'ocupado') return 'O servidor está ocupado. Tente de novo em instantes.';
  if (m === 'dados') return 'O servidor recusou os dados enviados.';
  if (semRede(m)) return 'Sem internet agora. Seus dados continuam salvos neste aparelho.';
  return m;
}
function agendarSync() {
  if (!syncAtiva()) return;
  clearTimeout(syncT); syncT = setTimeout(() => sincronizar(false), 500);
}
async function sincronizar(interativo) {
  if (!syncAtiva() || sincronizando) return;
  sincronizando = true; setSync('sinc', 'sincronizando…');
  let novos = 0;
  try {
    const s = data.sync, m = montarMeu(), enviar = m.hash !== s.enviado;
    /* na primeira vez depois de conectar, recupera do servidor os próprios registros */
    const j = await chamar(s, { acao: 'sync', meu: enviar ? m.obj : undefined, recuperar: s.recuperado ? undefined : true });
    if (j.meu) { mesclar(j.meu, EU()); aplicarNomes(j.meu.config); }
    s.recuperado = true; if (j.espaco) s.espaco = j.espaco;
    if (j.outro) novos = mesclarDoOutro(j.outro);
    if (enviar) s.enviado = m.hash;
    s.ultima = Date.now(); store.save(data);
    setSync('ok', j.outro ? '' : `${nome(OUT())} ainda não conectou`);
    verPedido(j.pedido);
    if (novos && interativo) toast(`${novos} novidade${novos > 1 ? 's' : ''} de ${nome(OUT())}.`);
    else if (interativo) toast('Tudo sincronizado.');
  } catch (e) {
    const t = msgErro(e); setSync('erro', t); if (interativo && t) toast(t);
  } finally {
    sincronizando = false;
    if (novos) verificarTudo();
    if (novos || ui.tab === 'conta' || ui.sync.estado !== 'ok') renderSeguro();
  }
}
function falhou(e) { const t = msgErro(e); if (t) toast(t); }

function ativarSync() {
  const url = (($('#s-url') || {}).value || '').trim();
  if (!/^https:\/\/script\.google\.com\/\S+\/exec$/.test(url)) return toast('Cole o endereço do Apps Script (começa com https://script.google.com e termina em /exec).');
  if (data.eventos.some(e => e.autor !== EU())) {
    return confirmar(`Há registros feitos no modo de teste como ${nome(OUT())}. Eles serão enviados como seus. Continuar?`, 'Continuar', () => executarAtivacao(url));
  }
  executarAtivacao(url);
}
async function executarAtivacao(url) {
  const token = novaChave();
  let j;
  try { toast('Ativando…'); j = await chamar({ url, token }, { acao: 'criar', autor: EU() }); }
  catch (e) { return falhou(e); }
  data.eventos.forEach(e => { if (e.autor !== EU()) e.autor = EU(); });
  data.v = 2;
  data.sync = { url, token, espaco: j.espaco, ultima: 0, enviado: '', recuperado: true };
  store.save(data);
  await sincronizar(true);
  render();
}

/* --- convidar (mostrar o QR) e autorizar com a digital --- */
async function convidar() {
  if (!syncAtiva()) return;
  const p = novaChave(16);
  try { await chamar(data.sync, { acao: 'convite', p }); } catch (e) { return falhou(e); }
  const s = data.sync, m = URL_SCRIPT.exec(s.url);
  const link = location.href.split('#')[0] + '#entrar=' + EU() + '.' + p + '.' + (m ? m[1] : encodeURIComponent(s.url));
  let qr; try { qr = QR.svg(link); } catch (e) { return toast('Não foi possível gerar o QR.'); }
  const o = esc(nome(OUT()));
  abrirSheet(`<h2>Conectar o celular de ${o}</h2>
    <p class="explica">No celular de ${o}, abra o Equilibra e toque em “Escanear QR”, ou aponte a câmera do celular para este código.</p>
    <div class="qr">${qr}</div>
    <p class="explica" style="text-align:center" id="qr-tempo">Vale por 10:00</p>
    <p class="explica">Depois que ${o} ler o código, este celular vai pedir a sua digital para autorizar. O código só funciona uma vez.</p>
    <div class="acoes"><button class="btn-sec" data-a="fecharSheet">Fechar</button></div>`);
  sheetEstado = { qr: true };
  const ate = Date.now() + 10 * 60000; let tique = 0;
  const iv = setInterval(() => {
    const resta = Math.max(0, ate - Date.now()), el = $('#qr-tempo');
    if (el) el.textContent = resta ? `Vale por ${Math.floor(resta / 60000)}:${String(Math.floor(resta / 1000) % 60).padStart(2, '0')}` : 'Este QR expirou. Feche e gere outro.';
    if (!resta) { clearInterval(iv); const q = $('#sheetBody .qr'); if (q) q.style.opacity = '.12'; return; }
    if (++tique % 3 === 0) sincronizar(false); /* procura o pedido de quem leu o QR */
  }, 1000);
  pararSheet = () => clearInterval(iv);
}
function sheetAprovar() {
  sheetEstado = { aprovar: true };
  const o = esc(nome(OUT()));
  return `<h2>📲 Pedido de conexão</h2>
  <p>Um celular leu o seu QR e quer entrar neste espaço como <b>${o}</b>.</p>
  <p class="explica" style="margin-top:8px">Só autorize se ${o} estiver com você e acabou de ler o QR. Se ${o} tinha outro celular conectado, aquele deixa de sincronizar.</p>
  <div class="erro" id="erro" role="alert" hidden></div>
  <div class="acoes"><button class="btn-sec" data-a="recusarConexao">Recusar</button><button class="btn" data-a="aprovarConexao">Autorizar com digital</button></div>`;
}
function verPedido(p) {
  const novo = !!p && (!ui.pedido || ui.pedido.id !== p.id);
  ui.pedido = p || null;
  if (novo && ($('#sheet').hidden || (sheetEstado && sheetEstado.qr))) abrirSheet(sheetAprovar());
  else if (!p && sheetEstado && sheetEstado.aprovar) fecharSheet();
}
const erroBio = er => er && /^(NotAllowedError|InvalidStateError|NotSupportedError|SecurityError|AbortError)$/.test(er.name);
async function aprovarConexao() {
  if (bioOcupado || !ui.pedido) return;
  const p = ui.pedido; bioOcupado = true;
  try {
    const cid = await garantirChave();
    await assinar({ item: 'conexao', id: p.id, tipo: 'aprovar', autor: EU(), dados: {} }, cid); /* exige a digital */
    await chamar(data.sync, { acao: 'aprovar', id: p.id, sim: true });
  } catch (er) { bioOcupado = false; return erroForm(erroBio(er) ? msgBio(er) : msgErro(er)); }
  bioOcupado = false; ui.pedido = null;
  fecharSheet(); toast(`Celular de ${nome(OUT())} conectado.`); render(); sincronizar(false);
}
async function recusarConexao() {
  const p = ui.pedido; if (!p) return fecharSheet();
  try { await chamar(data.sync, { acao: 'aprovar', id: p.id, sim: false }); } catch (e) { return falhou(e); }
  ui.pedido = null; fecharSheet(); toast('Pedido recusado.'); render();
}

/* --- entrar no espaço da outra pessoa (quem leu o QR) --- */
function lerConvite(txt) {
  const m = /#entrar=([ab])\.([A-Za-z0-9_-]{20,100})\.(\S+)$/.exec(String(txt || ''));
  if (!m) return null;
  let u; try { u = decodeURIComponent(m[3]); } catch (e) { return null; }
  if (/^[A-Za-z0-9_-]+$/.test(u)) u = `https://script.google.com/macros/s/${u}/exec`;
  if (!/^https:\/\/script\.google\.com\/\S+\/exec$/.test(u)) return null;
  return { a: m[1], p: m[2], url: u };
}
async function entrarComConvite(c) {
  const meu = ++entradaId;
  if (data && (syncAtiva() || data.eventos.length)) {
    ui.entrada = { erro: 'Este aparelho já tem dados ou já está conectado. Para entrar no espaço da outra pessoa, apague os dados deste aparelho (Conta › Apagar os dados deste aparelho) e leia o QR de novo.' };
    return render();
  }
  const eu = c.a === 'a' ? 'b' : 'a', s = { url: c.url, token: novaChave(), espaco: '', ultima: 0, enviado: '' };
  ui.entrada = { msg: 'Conectando…' }; render();
  try { await chamar(s, { acao: 'entrar', p: c.p }); }
  catch (e) { if (meu === entradaId) { ui.entrada = { erro: msgErro(e) }; render(); } return; }
  if (meu !== entradaId) return;
  ui.entrada = { msg: 'Esperando a autorização no outro celular…' }; render();
  const ate = Date.now() + 11 * 60000;
  const tentar = async () => {
    if (meu !== entradaId) return;
    try {
      const j = await chamar(s, { acao: 'sync', recuperar: true });
      if (meu === entradaId) concluirEntrada(j, s, eu, c.a);
    } catch (e) {
      if (meu !== entradaId) return;
      const m = String((e && e.message) || e);
      if ((m === 'aguardando' || semRede(m)) && Date.now() < ate) { setTimeout(tentar, 3000); return; }
      ui.entrada = { erro: m === 'chave' || m === 'aguardando' ? 'O pedido foi recusado ou o QR expirou. Peça um QR novo.' : msgErro(e) }; render();
    }
  };
  setTimeout(tentar, 3000);
}
function concluirEntrada(j, s, eu, quemConvidou) {
  const o = j.outro, c = (o && o.config) || {};
  const nomes = c.nomes && typeof c.nomes.a === 'string' && typeof c.nomes.b === 'string' ? c.nomes : { a: 'Pessoa 1', b: 'Pessoa 2' };
  data = { v: 2, config: { nomes: { a: nomes.a, b: nomes.b }, nomesTs: c.ts || 0, eu }, eventos: [], sync: { ...s, espaco: j.espaco || '', recuperado: true } };
  if (j.meu) { mesclar(j.meu, eu); aplicarNomes(j.meu.config); }
  if (o) mesclarDoOutro(o);
  store.save(data);
  ui.entrada = null; ui.tab = 'grupos'; ui.view = null;
  toast(`Conectado com ${nome(quemConvidou)}.`);
  fim();
}
function telaEntrada() {
  const e = ui.entrada;
  const corpo = e.erro
    ? `<p class="erro" role="alert" style="margin-top:16px">${esc(e.erro)}</p><button class="btn cheio" style="margin:12px 0 0;width:100%" data-a="cancelarEntrada">Voltar</button>`
    : `<p>${esc(e.msg)}</p><p class="explica">Peça para a outra pessoa tocar em “Autorizar com digital” no celular dela. Deixe esta tela aberta.</p><button class="btn-sec cheio" style="margin:20px 0 0;width:100%" data-a="cancelarEntrada">Cancelar</button>`;
  return `<main class="boas"><span class="logo">${LOGO}</span><h1>Equilibra</h1>${corpo}</main>`;
}
function abrirConviteDaUrl() {
  if (!/^#entrar=/.test(location.hash)) return;
  const c = lerConvite(location.hash);
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} /* tira o convite da barra de endereço */
  if (c) entrarComConvite(c); else toast('QR inválido. Peça um QR novo.');
}

/* --- ler o QR com a câmera, dentro do app --- */
async function escanear() {
  if (!('BarcodeDetector' in window) || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    return toast('Este navegador não lê QR. Use a câmera do celular para ler o código.');
  }
  let det, stream;
  try {
    det = new BarcodeDetector({ formats: ['qr_code'] });
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
  } catch (e) { return toast('Não foi possível abrir a câmera. Permita o acesso à câmera ou use a câmera do celular.'); }
  abrirSheet(`<h2>Escanear QR</h2><p class="explica">Aponte para o QR que aparece no celular da outra pessoa.</p>
    <video id="cam" playsinline muted autoplay style="width:100%;border-radius:12px;background:#000;margin-top:8px"></video>
    <div class="acoes"><button class="btn-sec" data-a="fecharSheet">Cancelar</button></div>`);
  sheetEstado = { cam: true };
  let ligado = true;
  pararSheet = () => { ligado = false; stream.getTracks().forEach(t => t.stop()); };
  const v = $('#cam'); v.srcObject = stream; if (v.play) v.play().catch(() => {});
  const procurar = async () => {
    if (!ligado) return;
    try {
      const r = await det.detect(v), c = r.length ? lerConvite(r[0].rawValue) : null;
      if (c && ligado) { fecharSheet(); entrarComConvite(c); return; }
    } catch (e) {}
    setTimeout(procurar, 300);
  };
  procurar();
}
function desconectar() {
  confirmar('Desconectar este celular? Os dados continuam aqui, mas param de sincronizar. Para voltar, a outra pessoa precisa mostrar um QR novo.', 'Desconectar', () => {
    data.sync = { url: data.sync.url, token: '', espaco: '', ultima: 0, enviado: '' };
    store.save(data); setSync('', ''); ui.pedido = null; render();
  });
}

/* ============================================================
   RENDER
   ============================================================ */
function render() {
  const app = $('#app');
  if (ui.entrada) { app.innerHTML = telaEntrada(); return; }
  if (!data) { app.innerHTML = telaBoas(); return; }
  const D = derivar();
  let v = ui.view;
  if (v && v.t === 'grupo') { const g = D.grupos.get(v.id); if (!g || g.apagado) v = ui.view = null; }
  if (v && v.t === 'despesa') { const d = D.desp.get(v.id); if (!d || d.apagada) v = ui.view = (v.grupo && D.grupos.get(v.grupo) && !D.grupos.get(v.grupo).apagado) ? { t: 'grupo', id: v.grupo } : null; }
  let html, fab = '', nav = '';
  if (v && v.t === 'grupo') { html = telaGrupo(D, v.id); fab = `<button class="fab sozinho" data-a="novaDespesa" data-g="${esc(v.id)}">+ Adicionar despesa</button>`; }
  else if (v && v.t === 'despesa') html = telaDespesa(D, v.id);
  else {
    html = ui.tab === 'atividade' ? telaAtividade(D) : ui.tab === 'conta' ? telaConta() : telaGrupos(D);
    nav = navInferior();
    if (ui.tab !== 'conta') fab = '<button class="fab" data-a="novaDespesa" data-g="">+ Adicionar despesa</button>';
  }
  app.innerHTML = html + fab + nav;
}

if (data) gerarRecorrentes();
render();
if (data && data.sync) sincronizar(false);
abrirConviteDaUrl(); /* aberto pelo QR lido com a câmera do celular */

window.addEventListener('hashchange', abrirConviteDaUrl);
window.addEventListener('online', () => { if (data) agendarSync(); });
setInterval(() => { if (!document.hidden && syncAtiva() && !sincronizando) sincronizar(false); }, 10000);
if (data) verificarTudo();

if ('serviceWorker' in navigator) window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
})();
</script>
